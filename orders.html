<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إتمام الطلب | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.infoBox{
background:#e8f5e9;
padding:15px;
border-radius:10px;
margin:15px 0;
line-height:1.9;
}

.totalBox{
background:#f5f5f5;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.totalBox p{
margin:8px 0;
font-size:17px;
}

.finalTotal{
font-size:22px !important;
font-weight:bold;
border-top:1px solid #ddd;
padding-top:10px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
background:#fff;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#009688;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00796b;
}

</style>

</head>

<body>

<header>
📦 إتمام طلب الجملة
</header>

<div class="container">

<div class="card">

<h2>
بيانات العميل
</h2>

<div class="infoBox">

📍 <strong>منطقة التوصيل:</strong>
مدينة إب

<br>

📦 <strong>نوع الطلب:</strong>
طلب جملة

<br>

🚚 <strong>التوصيل المسائي:</strong>
من بعد المغرب حتى الساعة 10 مساءً

<br>

☀️ <strong>الفترة الصباحية:</strong>
مخصصة للمشاوير والتوصيلات الأخرى

</div>

<input
id="customerName"
placeholder="اسم العميل"
>

<input
id="customerPhone"
placeholder="رقم الجوال"
type="tel"
>

<textarea
id="customerAddress"
placeholder="العنوان بالتفصيل داخل مدينة إب"
></textarea>

<select id="deliveryTime">

<option value="">
اختر وقت التوصيل
</option>

<option value="مساءً - من بعد المغرب حتى 10 مساءً">
🌙 مساءً - من بعد المغرب حتى 10 مساءً
</option>

</select>

<div class="totalBox">

<p>
🛍️ مجموع المنتجات:
<strong>
<span id="productsTotal">0</span> ريال
</strong>
</p>

<p>
🚚 التوصيل:
<strong>
يتم التنسيق لطلبات الجملة
</strong>
</p>

<p class="finalTotal">
💰 إجمالي المنتجات:
<strong>
<span id="totalPrice">0</span> ريال
</strong>
</p>

</div>

<button id="sendOrder">
إرسال طلب الجملة
</button>

</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const cart =
JSON.parse(localStorage.getItem("cart")) || [];


let productsTotal = 0;


cart.forEach(item => {

productsTotal += Number(item.price || 0);

});


const finalTotal = productsTotal;


document.getElementById("productsTotal").textContent =
productsTotal;

document.getElementById("totalPrice").textContent =
finalTotal;


document.getElementById("sendOrder").onclick = async () => {


const name =
document.getElementById("customerName").value.trim();


const phone =
document.getElementById("customerPhone").value.trim();


const address =
document.getElementById("customerAddress").value.trim();


const deliveryTime =
document.getElementById("deliveryTime").value;


if(!name || !phone || !address || !deliveryTime){

alert("يرجى تعبئة جميع البيانات واختيار وقت التوصيل");

return;

}


if(cart.length === 0){

alert("السلة فارغة");

return;

}


try{


await addDoc(
collection(db,"orders"),
{

customerName:name,

customerPhone:phone,

customerCity:"إب",

customerAddress:address,

deliveryArea:"مدينة إب",

orderType:"جملة",

deliveryTime:deliveryTime,

deliveryFee:0,

products:cart,

productsTotal:productsTotal,

total:finalTotal,

status:"جديد",

createdAt:serverTimestamp()

}
);


let message = `🛒 طلب جملة جديد من سوق مباشر

الاسم: ${name}

الجوال: ${phone}

📍 منطقة التوصيل:
مدينة إب

📦 نوع الطلب:
جملة

العنوان:
${address}

🕐 وقت التوصيل:
${deliveryTime}

🛍️ مجموع المنتجات:
${productsTotal} ريال

🚚 التوصيل:
يتم التنسيق لطلبات الجملة

💰 إجمالي المنتجات:
${finalTotal} ريال`;


window.open(

`https://wa.me/966550496391?text=${encodeURIComponent(message)}`,

"_blank"

);


localStorage.removeItem("cart");


alert("تم إرسال طلب الجملة بنجاح ✅");


location.href="index.html";


}catch(error){

console.error(error);

alert("حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى");

}

};

</script>

</body>

</html>
