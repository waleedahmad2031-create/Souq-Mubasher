<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إتمام الطلب | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.infoBox{
background:#e8f5e9;
padding:15px;
border-radius:10px;
margin:15px 0;
line-height:1.9;
}

.totalBox{
background:#f5f5f5;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.totalBox p{
margin:8px 0;
font-size:17px;
}

.finalTotal{
font-size:22px !important;
font-weight:bold;
border-top:1px solid #ddd;
padding-top:10px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
background:#fff;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#009688;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00796b;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

</style>

</head>

<body>

<header>
📦 إتمام طلب الجملة
</header>

<div class="container">

<div class="card">

<h2>
بيانات العميل
</h2>

<div class="infoBox">

📍 <strong>منطقة التوصيل:</strong>
مدينة إب

<br>

📦 <strong>نوع الطلب:</strong>
طلب جملة

<br>

🌙 <strong>التوصيل المسائي:</strong>
من بعد المغرب حتى الساعة 10 مساءً

</div>


<input
id="customerName"
placeholder="اسم العميل"
>

<input
id="customerPhone"
placeholder="رقم الجوال"
type="tel"
>

<textarea
id="customerAddress"
placeholder="العنوان بالتفصيل داخل مدينة إب"
></textarea>


<select id="deliveryTime">

<option value="">
اختر وقت التوصيل
</option>

<option value="مساءً - من بعد المغرب حتى 10 مساءً">
🌙 مساءً - من بعد المغرب حتى 10 مساءً
</option>

</select>


<div class="totalBox">

<p>
📦 عدد الكراتين:
<strong>
<span id="cartonsTotal">0</span>
</strong>
</p>

<p>
🛍️ مجموع المنتجات:
<strong>
<span id="productsTotal">0</span> ريال
</strong>
</p>

<p>
🚚 رسوم التوصيل:
<strong>
<span id="deliveryTotal">0</span> ريال
</strong>
</p>

<p class="finalTotal">

💰 الإجمالي النهائي:
<strong>
<span id="totalPrice">0</span> ريال
</strong>

</p>

</div>


<button id="sendOrder">
إرسال طلب الجملة
</button>

</div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   قراءة السلة
===================================== */

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


/* =====================================
   حساب رسوم التوصيل للكرتون
===================================== */

function getDeliveryFee(price){

price = Number(price || 0);

if(price < 1500){
return 50;
}

if(price < 2000){
return 70;
}

return 100;

}


/* =====================================
   حساب الطلب
===================================== */

let productsTotal = 0;

let deliveryTotal = 0;

let cartonsTotal = 0;


cart.forEach(item => {

const price =
Number(item.price || 0);

const quantity =
Number(item.quantity) > 0
? Number(item.quantity)
: 1;


productsTotal +=
price * quantity;


deliveryTotal +=
getDeliveryFee(price) * quantity;


cartonsTotal +=
quantity;

});


const finalTotal =
productsTotal + deliveryTotal;


/* =====================================
   عرض الحساب
===================================== */

document.getElementById(
"cartonsTotal"
).textContent =
cartonsTotal;


document.getElementById(
"productsTotal"
).textContent =
productsTotal.toLocaleString();


document.getElementById(
"deliveryTotal"
).textContent =
deliveryTotal.toLocaleString();


document.getElementById(
"totalPrice"
).textContent =
finalTotal.toLocaleString();


/* =====================================
   زر إرسال الطلب
===================================== */

const sendOrder =
document.getElementById(
"sendOrder"
);


/* =====================================
   إرسال الطلب
===================================== */

sendOrder.onclick =
async () => {


/* منع الضغط المتكرر */

if(sendOrder.disabled){
return;
}


/* =====================================
   بيانات العميل
===================================== */

const name =
document.getElementById(
"customerName"
).value.trim();


const phone =
document.getElementById(
"customerPhone"
).value.trim();


const address =
document.getElementById(
"customerAddress"
).value.trim();


const deliveryTime =
document.getElementById(
"deliveryTime"
).value;


/* =====================================
   التحقق من البيانات
===================================== */

if(
!name ||
!phone ||
!address ||
!deliveryTime
){

alert(
"يرجى تعبئة جميع البيانات واختيار وقت التوصيل"
);

return;

}


if(cart.length === 0){

alert(
"السلة فارغة"
);

return;

}


/* تعطيل الزر مؤقتًا */

sendOrder.disabled = true;

sendOrder.textContent =
"⏳ جاري تسجيل الطلب...";


try{


/* =====================================
   تجهيز المنتجات للحفظ
===================================== */

const products =
cart.map(item => ({

id:
String(item.id || ""),

name:
String(item.name || ""),

price:
Number(item.price || 0),

image:
String(item.image || ""),

city:
String(item.city || ""),

description:
String(item.description || ""),

shopName:
String(item.shopName || ""),

quantity:
Number(item.quantity) > 0
? Number(item.quantity)
: 1

}));


/* =====================================
   حفظ الطلب في Firebase
===================================== */

const orderData = {

customerName:
String(name),

customerPhone:
String(phone),

customerCity:
"إب",

customerAddress:
String(address),

deliveryArea:
"مدينة إب",

orderType:
"جملة",

deliveryTime:
String(deliveryTime),

deliveryFee:
Number(deliveryTotal),

cartonsTotal:
Number(cartonsTotal),

products:
products,

productsTotal:
Number(productsTotal),

total:
Number(finalTotal),

status:
"جديد",

createdAt:
serverTimestamp()

};


/* =====================================
   إرسال إلى orders
===================================== */

const orderRef =
await addDoc(
collection(db,"orders"),
orderData
);


console.log(
"تم حفظ الطلب:",
orderRef.id
);


/* =====================================
   إنشاء رسالة المنتجات
===================================== */

let productsMessage = "";


products.forEach(
(item,index) => {

const quantity =
Number(item.quantity) > 0
? Number(item.quantity)
: 1;


productsMessage +=
`${index + 1}. ${
item.name || "منتج"
} × ${quantity} كرتون\n`;

});


/* =====================================
   رسالة واتساب
===================================== */

const message =
`🛒 طلب جملة جديد - سوق مباشر

👤 العميل: ${name}
📱 الجوال: ${phone}

📍 إب
🏠 العنوان: ${address}

🕐 التوصيل: ${deliveryTime}

📦 المنتجات:
${productsMessage}

📦 إجمالي الكراتين: ${cartonsTotal}
🛍️ مجموع المنتجات: ${productsTotal} ريال
🚚 التوصيل: ${deliveryTotal} ريال

💰 الإجمالي النهائي: ${finalTotal} ريال

🆔 رقم الطلب:
${orderRef.id}`;


/* =====================================
   فتح واتساب
===================================== */

window.open(
`https://wa.me/966550496391?text=${
encodeURIComponent(message)
}`,
"_blank"
);


/* =====================================
   حذف السلة
===================================== */

localStorage.removeItem("cart");


/* =====================================
   رسالة النجاح
===================================== */

alert(
"✅ تم تسجيل طلبك بنجاح\n\n" +
"رقم الطلب:\n" +
orderRef.id
);


/* =====================================
   العودة للرئيسية
===================================== */

location.href =
"index.html";


}catch(error){

console.error(
"❌ خطأ حفظ الطلب:",
error
);


/* =====================================
   إظهار الخطأ الحقيقي
===================================== */

sendOrder.disabled = false;

sendOrder.textContent =
"إرسال طلب الجملة";


alert(
"❌ حدث خطأ أثناء حفظ الطلب\n\n" +
"الكود:\n" +
(error.code || "غير معروف") +
"\n\n" +
"الرسالة:\n" +
(error.message || "لا توجد رسالة")
);

}

};

</script>

</body>

</html>
