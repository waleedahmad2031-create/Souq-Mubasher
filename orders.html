<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إتمام الطلب | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
max-width:850px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
color:#009688;
margin-bottom:15px;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
margin-bottom:6px;
}

input,
textarea,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:none;
}

input:focus,
textarea:focus,
select:focus{
border-color:#009688;
}

textarea{
min-height:100px;
resize:vertical;
}

.summary{
background:#e8f5e9;
padding:18px;
border-radius:10px;
line-height:2;
margin-top:15px;
}

.summary p{
font-size:18px;
}

.delivery{
color:#00796b;
}

.total{
border-top:1px solid #bbb;
margin-top:10px;
padding-top:10px;
font-size:24px !important;
font-weight:bold;
color:#00796b;
}

.shop{
background:#e3f2fd;
color:#1565c0;
padding:14px;
border-radius:8px;
font-size:18px;
font-weight:bold;
margin-bottom:15px;
text-align:center;
}

.products{
background:#fafafa;
padding:12px;
border-radius:8px;
line-height:2;
margin-top:15px;
}

.orderBtn{
width:100%;
margin-top:20px;
padding:16px;
background:#009688;
color:white;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.orderBtn:hover{
background:#00796b;
}

.orderBtn:disabled{
background:#999;
cursor:not-allowed;
}

.backBtn{
width:100%;
margin-top:10px;
padding:14px;
background:#777;
color:white;
border:none;
border-radius:10px;
font-size:17px;
}

.message{
display:none;
padding:15px;
border-radius:8px;
margin-top:15px;
font-weight:bold;
line-height:1.8;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

</style>

</head>

<body>

<header>
📦 إتمام الطلب
</header>

<div class="container">

<!-- التاجر -->

<div class="card">

<div id="shopBox" class="shop">
🏪 جاري تحميل بيانات التاجر...
</div>

<h2>
🛒 تفاصيل الطلب
</h2>

<div id="productsBox" class="products">
جاري تحميل المنتجات...
</div>

<div class="summary">

<p>
🛍️ مجموع المنتجات:

<strong>
<span id="productsTotal">0</span>
ريال
</strong>
</p>

<p class="delivery">
🚚 رسوم التوصيل:

<strong>
<span id="deliveryTotal">0</span>
ريال
</strong>
</p>

<p class="total">
💰 الإجمالي النهائي:

<strong>
<span id="orderTotal">0</span>
ريال
</strong>
</p>

</div>

</div>


<!-- بيانات العميل -->

<div class="card">

<h2>
👤 بيانات الزبون
</h2>

<label>
اسم العميل
</label>

<input
type="text"
id="customerName"
placeholder="اكتب اسمك"
>

<label>
رقم الجوال
</label>

<input
type="tel"
id="customerPhone"
placeholder="05xxxxxxxx أو 7xxxxxxxx"
>

<label>
المدينة
</label>

<input
type="text"
id="customerCity"
value="إب"
placeholder="مثال: إب"
>

<label>
اسم الحي
</label>

<input
type="text"
id="deliveryArea"
placeholder="اكتب اسم الحي"
>



<label>
نوع الطلب
</label>

<select id="orderType">

<option value="جملة">
طلب جملة
</option>

<option value="شراء">
شراء
</option>

</select>

<label>
وقت التوصيل المناسب
</label>

<select id="deliveryTime">

<option value="في أقرب وقت">
في أقرب وقت
</option>

<option value="صباحًا">
صباحًا
</option>

<option value="ظهرًا">
ظهرًا
</option>

<option value="مساءً">
مساءً
</option>

</select>

<button
class="orderBtn"
id="sendOrder"
>
📦 إرسال الطلب
</button>

<button
class="backBtn"
onclick="location.href='cart.html'"
>
⬅️ العودة إلى السلة
</button>

<div
id="message"
class="message"
></div>

</div>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ======================================
// قراءة السلة
// ======================================

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];


// ======================================
// العناصر
// ======================================

const productsTotalElement =
document.getElementById("productsTotal");

const deliveryTotalElement =
document.getElementById("deliveryTotal");

const orderTotalElement =
document.getElementById("orderTotal");

const productsBox =
document.getElementById("productsBox");

const shopBox =
document.getElementById("shopBox");

const sendOrder =
document.getElementById("sendOrder");

const message =
document.getElementById("message");


// ======================================
// رسوم التوصيل لكل كرتون
// ======================================

function getDeliveryPerCarton(price){

price =
Number(price || 0);

if(price < 1500){
return 50;
}

if(price < 2000){
return 70;
}

return 100;

}


// ======================================
// حساب الإجمالي
// ======================================

function calculateOrder(){

let productsTotal = 0;

let deliveryTotal = 0;

cart.forEach(item => {

const price =
Number(item.price || 0);

const quantity =
Number(item.quantity || 1);

productsTotal +=
price * quantity;

const deliveryPerCarton =
getDeliveryPerCarton(price);

deliveryTotal +=
deliveryPerCarton * quantity;

});

const orderTotal =
productsTotal +
deliveryTotal;

return {
productsTotal,
deliveryTotal,
orderTotal
};

}


// ======================================
// عرض المنتجات
// ======================================

function renderProducts(){

productsBox.innerHTML = "";

if(cart.length === 0){

productsBox.innerHTML =
"❌ السلة فارغة";

sendOrder.disabled = true;

return;

}

let html = "";

cart.forEach(item => {

const price =
Number(item.price || 0);

const quantity =
Number(item.quantity || 1);

const subtotal =
price * quantity;

const delivery =
getDeliveryPerCarton(price) * quantity;

html += `

<div>

📦 <strong>
${escapeHtml(item.name || "منتج")}
</strong>

<br>

السعر:
${price.toLocaleString()}
ريال

<br>

الكمية:
${quantity} كرتون

<br>

قيمة المنتجات:
${subtotal.toLocaleString()}
ريال

<br>

التوصيل:
${delivery.toLocaleString()}
ريال

<hr>

</div>

`;

});

productsBox.innerHTML =
html;

}


// ======================================
// عرض الإجمالي
// ======================================

function renderTotals(){

const totals =
calculateOrder();

productsTotalElement.textContent =
totals.productsTotal.toLocaleString();

deliveryTotalElement.textContent =
totals.deliveryTotal.toLocaleString();

orderTotalElement.textContent =
totals.orderTotal.toLocaleString();

localStorage.setItem(
"productsTotal",
String(totals.productsTotal)
);

localStorage.setItem(
"deliveryTotal",
String(totals.deliveryTotal)
);

localStorage.setItem(
"orderTotal",
String(totals.orderTotal)
);

}


// ======================================
// عرض اسم التاجر
// ======================================

function renderShop(){

if(cart.length === 0){

shopBox.textContent =
"🏪 لا يوجد تاجر";

return;

}

const shop =
String(
cart[0].shopName || "سوق مباشر"
).trim();

shopBox.innerHTML =
"🏪 التاجر: <strong>" +
escapeHtml(shop) +
"</strong>";

}


// ======================================
// إرسال الطلب
// ======================================

sendOrder.onclick =
async function(){

if(cart.length === 0){

showError(
"❌ السلة فارغة"
);

return;

}


// ======================================
// بيانات العميل
// ======================================

const customerName =
document
.getElementById("customerName")
.value
.trim();

const customerPhone =
document
.getElementById("customerPhone")
.value
.trim();

const customerCity =
document
.getElementById("customerCity")
.value
.trim();

const deliveryArea =
document
.getElementById("deliveryArea")
.value
.trim();

const customerAddress =
document
.getElementById("customerAddress")
.value
.trim();

const orderType =
document
.getElementById("orderType")
.value;

const deliveryTime =
document
.getElementById("deliveryTime")
.value;


// ======================================
// التحقق
// ======================================

if(!customerName){

showError(
"⚠️ اكتب اسم العميل"
);

return;

}

if(!customerPhone){

showError(
"⚠️ اكتب رقم الجوال"
);

return;

}

if(!customerCity){

showError(
"⚠️ اكتب المدينة"
);

return;

}

if(!deliveryArea){

showError(
"⚠️ اكتب اسم الحي"
);

return;

}

if(!customerAddress){

showError(
"⚠️ اكتب العنوان بالتفصيل"
);

return;

}


// ======================================
// التأكد من تاجر واحد
// ======================================

const firstShop =
String(
cart[0].shopName || ""
).trim();

const differentShop =
cart.find(item => {

return String(
item.shopName || ""
).trim()
!== firstShop;

});

if(differentShop){

showError(
"⚠️ لا يمكن إرسال طلب يحتوي على منتجات من أكثر من تاجر."
);

return;

}


// ======================================
// الحساب
// ======================================

const totals =
calculateOrder();

const sellerId =
cart[0].sellerId || "";

const shopName =
firstShop ||
"سوق مباشر";


// ======================================
// تجهيز المنتجات
// ======================================

const products =
cart.map(item => {

const price =
Number(item.price || 0);

const quantity =
Number(item.quantity || 1);

const deliveryPerCarton =
getDeliveryPerCarton(price);

return {

name:
item.name || "",

price:
price,

quantity:
quantity,

sellerId:
item.sellerId || "",

shopName:
item.shopName || shopName,

image:
item.image || "",

deliveryPerCarton:
deliveryPerCarton,

deliveryTotal:
deliveryPerCarton * quantity,

subtotal:
price * quantity

};

});


// ======================================
// بيانات الطلب
// ======================================

const orderData = {

customerName:
customerName,

customerPhone:
customerPhone,

customerCity:
customerCity,

deliveryArea:
deliveryArea,

customerAddress:
customerAddress,

orderType:
orderType,

deliveryTime:
deliveryTime,

products:
products,

productsTotal:
totals.productsTotal,

deliveryTotal:
totals.deliveryTotal,

total:
totals.orderTotal,

sellerId:
sellerId,

shopName:
shopName,

status:
"جديد",

createdAt:
serverTimestamp()

};


// ======================================
// منع الضغط مرتين
// ======================================

sendOrder.disabled = true;

sendOrder.textContent =
"⏳ جاري إرسال الطلب...";


try{


// ======================================
// حفظ الطلب في Firebase
// ======================================

await addDoc(
collection(db,"orders"),
orderData
);


// ======================================
// رسالة واتساب
// ======================================

let whatsappMessage =

`🛒 *طلب جديد من سوق مباشر*

🏪 التاجر: ${shopName}

👤 العميل: ${customerName}

📱 الجوال: ${customerPhone}

🏙️ المدينة: ${customerCity}

📍 الحي: ${deliveryArea}

🏠 العنوان:
${customerAddress}

📦 نوع الطلب: ${orderType}

⏰ وقت التوصيل:
${deliveryTime}

━━━━━━━━━━━━

`;

products.forEach((product,index) => {

whatsappMessage +=

`${index + 1}. ${product.name}
📦 الكمية: ${product.quantity} كرتون
💰 سعر الكرتون: ${product.price.toLocaleString()} ريال
💵 المجموع: ${product.subtotal.toLocaleString()} ريال
🚚 التوصيل: ${product.deliveryTotal.toLocaleString()} ريال

`;

});


whatsappMessage +=

`━━━━━━━━━━━━

🛍️ مجموع المنتجات:
${totals.productsTotal.toLocaleString()} ريال

🚚 رسوم التوصيل:
${totals.deliveryTotal.toLocaleString()} ريال

💰 *الإجمالي النهائي:*
${totals.orderTotal.toLocaleString()} ريال

✅ حالة الطلب: جديد

شكراً لاستخدام سوق مباشر ❤️`;


// ======================================
// رقم واتساب استقبال جميع الطلبات
// ======================================

const receiverPhone =
"967550496391";


// ======================================
// فتح واتساب على رقمك مباشرة
// ======================================

const whatsappUrl =

`https://wa.me/${receiverPhone}?text=${encodeURIComponent(whatsappMessage)}`;


// ======================================
// فتح واتساب
// ======================================

window.location.href =
whatsappUrl;


// ======================================
// تنظيف السلة
// ======================================

localStorage.removeItem("cart");


}catch(error){

console.error(error);

showError(
"❌ حدث خطأ أثناء إرسال الطلب. حاول مرة أخرى."
);

sendOrder.disabled = false;

sendOrder.textContent =
"📦 إرسال الطلب";

}

};


// ======================================
// رسالة الخطأ
// ======================================

function showError(text){

message.style.display =
"block";

message.className =
"message error";

message.textContent =
text;

}


// ======================================
// حماية HTML
// ======================================

function escapeHtml(text){

return String(text ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


// ======================================
// التشغيل
// ======================================

renderProducts();

renderTotals();

renderShop();

</script>

</body>

</html>
