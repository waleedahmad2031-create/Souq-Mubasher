<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إتمام الطلب | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input,
textarea{
width:100%;
padding:12px;
margin-top:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#009688;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00796b;
}

</style>

</head>

<body>

<header>
📦 إتمام الطلب
</header>

<div class="container">

<div class="card">

<h2>بيانات العميل</h2>

<input id="customerName" placeholder="الاسم">

<input id="customerPhone" placeholder="رقم الجوال">

<input id="customerCity" placeholder="المدينة">

<textarea id="customerAddress" placeholder="العنوان بالتفصيل"></textarea>

<button id="sendOrder">
إرسال الطلب
</button>

</div>

</div>
</div>
<script type="module">

import { db } from "./firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cart = JSON.parse(localStorage.getItem("cart")) || [];

document.getElementById("sendOrder").onclick = async () => {

const name = document.getElementById("customerName").value.trim();
const phone = document.getElementById("customerPhone").value.trim();
const city = document.getElementById("customerCity").value.trim();
const address = document.getElementById("customerAddress").value.trim();

if(!name || !phone || !city || !address){

alert("يرجى تعبئة جميع البيانات");

return;

}

let total = 0;

cart.forEach(item => {
total += Number(item.price || 0);
});

await addDoc(collection(db,"orders"),{

customerName:name,
customerPhone:phone,
customerCity:city,
customerAddress:address,

products:cart,

total:total,

status:"جديد",

createdAt:serverTimestamp()

});

let message = `🛒 طلب جديد

الاسم: ${name}
الجوال: ${phone}
المدينة: ${city}
العنوان: ${address}

الإجمالي: ${total} ريال`;

window.open(
`https://wa.me/966550496391?text=${encodeURIComponent(message)}`,
"_blank"
);

localStorage.removeItem("cart");

alert("تم إرسال الطلب بنجاح");

location.href="index.html";

};

</script>

</body>
</html>
