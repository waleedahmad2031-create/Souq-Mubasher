<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة البائعين | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#3f51b5;
color:white;
padding:20px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
margin-bottom:18px;
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:15px;
}

.sellerCard{
background:#fff;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
border-right:5px solid #3f51b5;
}

.sellerName{
font-size:21px;
font-weight:bold;
color:#303f9f;
margin-bottom:12px;
}

.info{
line-height:2;
font-size:16px;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
font-size:17px;
font-weight:bold;
color:white;
cursor:pointer;
margin-top:10px;
}

.edit{
background:#009688;
}

.save{
background:#3f51b5;
}

.back{
background:#757575;
}

.statusActive{
color:#2e7d32;
font-weight:bold;
}

.statusStopped{
color:#c62828;
font-weight:bold;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-top:12px;
line-height:1.8;
text-align:center;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

</style>

</head>

<body>

<header>
🏪 إدارة البائعين
</header>


<div class="container">


<div class="card">

<div class="title">
👥 البائعون المسجلون
</div>

<div id="message" class="message"></div>

<div id="sellersList">

جاري تحميل البائعين...

</div>

</div>


<div class="card">

<button
class="back"
onclick="location.href='admin.html'"
>
⬅️ العودة إلى لوحة الإدارة
</button>

</div>


</div>


<script type="module">

import { db, auth } from "./firebase.js";


import {
collection,
getDocs,
doc,
updateDoc,
query,
where,
writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const sellersList =
document.getElementById("sellersList");


const messageBox =
document.getElementById("message");


const allowedEmails = [

"waleedahmad@gmail.com",

"waleedahmadahmad@gmail.com",

"waleedahmad2031@gmail.com"

];


/* =====================================
   رسالة
===================================== */

function showMessage(
text,
type
){

messageBox.textContent =
text;

messageBox.className =
"message " + type;

messageBox.style.display =
"block";

}


/* =====================================
   تحميل البائعين
===================================== */

async function loadSellers(){

sellersList.innerHTML =
"جاري تحميل البائعين...";


try{

const snapshot =
await getDocs(
collection(db,"sellers")
);


if(snapshot.empty){

sellersList.innerHTML = `

<div class="empty">

👥 لا يوجد بائعون مسجلون.

</div>

`;

return;

}


sellersList.innerHTML = "";


snapshot.forEach(
sellerDoc => {

const seller =
sellerDoc.data();


const sellerId =
sellerDoc.id;


const shopName =
seller.shopName ||
"بدون اسم";


const email =
seller.email ||
"-";


const phone =
seller.phone ||
"-";


const status =
seller.status ||
"غير محدد";


const subscription =
seller.subscription ||
"free";


const statusHTML =
status === "active"

? `<span class="statusActive">
🟢 نشط
</span>`

: `<span class="statusStopped">
🔴 ${escapeHtml(status)}
</span>`;


const card =
document.createElement("div");


card.className =
"sellerCard";


card.innerHTML = `

<div class="sellerName">

🏪 ${escapeHtml(shopName)}

</div>


<div class="info">

🆔 معرف البائع:

<br>

<small>
${escapeHtml(sellerId)}
</small>

<br><br>


📧 البريد:

${escapeHtml(email)}

<br>


📱 الجوال:

${escapeHtml(phone)}

<br>


📌 الحالة:

${statusHTML}

<br>


💳 الاشتراك:

${escapeHtml(subscription)}

</div>


<button
class="edit"
data-id="${escapeHtml(sellerId)}"
>
✏️ تعديل اسم التاجر
</button>


<div
id="edit-${escapeHtml(sellerId)}"
style="display:none;margin-top:10px;"
>

<input
id="input-${escapeHtml(sellerId)}"
value="${escapeHtml(shopName)}"
placeholder="اسم التاجر أو البقالة"
>


<button
class="save"
data-save-id="${escapeHtml(sellerId)}"
>
💾 حفظ الاسم
</button>

</div>

`;


sellersList.appendChild(card);

});


/* =====================================
   أزرار تعديل الاسم
===================================== */

document
.querySelectorAll(".edit")
.forEach(button => {

button.addEventListener(
"click",
function(){

const id =
this.dataset.id;


const editBox =
document.getElementById(
"edit-" + id
);


if(editBox){

editBox.style.display =
editBox.style.display === "none"
? "block"
: "none";

}

});

});


/* =====================================
   أزرار الحفظ
===================================== */

document
.querySelectorAll("[data-save-id]")
.forEach(button => {

button.addEventListener(
"click",
async function(){

const sellerId =
this.dataset.saveId;


const input =
document.getElementById(
"input-" + sellerId
);


if(!input){

return;

}


const newName =
input.value.trim();


if(!newName){

alert(
"⚠️ اكتب اسم التاجر أولًا"
);

return;

}


this.disabled =
true;

this.textContent =
"⏳ جاري الحفظ...";


try{


/* =====================================
   تحديث بيانات البائع
===================================== */

await updateDoc(

doc(
db,
"sellers",
sellerId
),

{

shopName:
newName

}

);


/* =====================================
   تحديث اسم التاجر في المنتجات الحالية
===================================== */

const productsQuery =
query(

collection(db,"products"),

where(
"sellerId",
"==",
sellerId
)

);


const productsSnap =
await getDocs(
productsQuery
);


/*
   نستخدم Batch لتحديث المنتجات
*/

let batch =
writeBatch(db);

let count = 0;


for(
const productDoc
of productsSnap.docs
){

batch.update(

doc(
db,
"products",
productDoc.id
),

{

shopName:
newName

}

);


count++;


/*
   Firestore Batch يدعم حتى 500 عملية.
   نرسل كل 450 عملية.
*/

if(count >= 450){

await batch.commit();

batch =
writeBatch(db);

count = 0;

}

}


if(count > 0){

await batch.commit();

}


/* =====================================
   نجاح
===================================== */

showMessage(

"✅ تم تعديل اسم التاجر بنجاح.\n\n" +

"🏪 الاسم الجديد: " +
newName +

"\n\n" +

"📦 تم تحديث اسم التاجر في " +
productsSnap.size +
" منتج.",

"success"

);


await loadSellers();


}catch(error){

console.error(error);


showMessage(

"❌ حدث خطأ أثناء تعديل اسم التاجر:\n\n" +
error.message,

"error"

);


this.disabled =
false;

this.textContent =
"💾 حفظ الاسم";

}

});

});



}catch(error){

console.error(error);


sellersList.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل البائعين.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =====================================
   حماية المدير
===================================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

alert(
"يجب تسجيل دخول المدير أولًا"
);

location.href =
"login.html";

return;

}


if(
!allowedEmails.includes(
user.email
)
){

alert(
"ليس لديك صلاحية دخول إدارة البائعين"
);

location.href =
"login.html";

return;

}


loadSellers();

}

);


/* =====================================
   حماية النصوص
===================================== */

function escapeHtml(text){

return String(
text ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

</script>

</body>

</html>
