<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>إدارة البائعين | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#3f51b5;
color:white;
padding:20px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
margin-bottom:18px;
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:15px;
}

.sellerCard{
background:#fff;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
border-right:5px solid #3f51b5;
}

.sellerName{
font-size:21px;
font-weight:bold;
color:#303f9f;
margin-bottom:12px;
}

.info{
line-height:2;
font-size:16px;
}

input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
font-size:17px;
font-weight:bold;
color:white;
cursor:pointer;
margin-top:10px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.addMoshtaq{
background:#009688;
}

.edit{
background:#009688;
}

.save{
background:#3f51b5;
}

.stop{
background:#ff9800;
}

.activate{
background:#2e7d32;
}

.delete{
background:#d32f2f;
}

.back{
background:#757575;
}

.statusActive{
color:#2e7d32;
font-weight:bold;
}

.statusStopped{
color:#c62828;
font-weight:bold;
}

.statusUnknown{
color:#757575;
font-weight:bold;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-top:12px;
line-height:1.8;
text-align:center;
white-space:pre-line;
}

.success{
background:#e8f5e9;
color:#2e7d32;
}

.error{
background:#ffebee;
color:#c62828;
}

.warning{
background:#fff3e0;
color:#e65100;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

.divider{
height:1px;
background:#eee;
margin:15px 0;
}

</style>

</head>

<body>

<header>
🏪 إدارة البائعين
</header>

<div class="container">

<!-- إضافة مشتاق وليد -->

<div class="card">

<div class="title">
🏪 إضافة التاجر الحالي
</div>

<div class="info">

التاجر <strong>مشتاق وليد</strong> موجود في المنتجات،
لكن غير مسجل في قائمة البائعين.

</div>

<button
id="addMoshtaqBtn"
class="addMoshtaq"
>
➕ إضافة مشتاق وليد وربط منتجاته
</button>

</div>


<!-- قائمة البائعين -->

<div class="card">

<div class="title">
👥 البائعون المسجلون
</div>

<div id="message" class="message"></div>

<div id="sellersList">

جاري تحميل البائعين...

</div>

</div>


<div class="card">

<button
class="back"
onclick="location.href='admin.html'"
>
⬅️ العودة إلى لوحة الإدارة
</button>

</div>

</div>


<script type="module">

import {
db,
auth
} from "./firebase.js";


import {

collection,
getDocs,
doc,
getDoc,
updateDoc,
deleteDoc,
query,
where,
writeBatch,
setDoc

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const sellersList =
document.getElementById("sellersList");

const messageBox =
document.getElementById("message");

const addMoshtaqBtn =
document.getElementById("addMoshtaqBtn");


/* =====================================
   المديرون المسموح لهم
===================================== */

const allowedEmails = [

"waleedahmad@gmail.com",

"waleedahmadahmad@gmail.com",

"waleedahmad2031@gmail.com"

];


/* =====================================
   رسالة
===================================== */

function showMessage(text,type){

messageBox.textContent =
text;

messageBox.className =
"message " + type;

messageBox.style.display =
"block";

}


/* =====================================
   إخفاء الرسالة
===================================== */

function hideMessage(){

messageBox.style.display =
"none";

}


/* =====================================
   إضافة مشتاق وليد
===================================== */

addMoshtaqBtn.onclick =
async function(){

const confirmAdd =
confirm(

"🏪 إضافة مشتاق وليد\n\n" +

"سيتم إنشاء سجل للتاجر وربط منتجاته القديمة به.\n\n" +

"لن يتم حذف أي منتج.\n\n" +

"هل تريد المتابعة؟"

);

if(!confirmAdd){

return;

}

this.disabled =
true;

this.textContent =
"⏳ جاري إضافة التاجر...";


try{

/*
   معرف ثابت لمشتاق وليد
*/

const sellerId =
"moshtaq-waleed";


/*
   التأكد هل هو موجود
*/

const sellerRef =
doc(
db,
"sellers",
sellerId
);

const sellerSnap =
await getDoc(
sellerRef
);


/*
   إذا لم يكن موجودًا ننشئه
*/

if(!sellerSnap.exists()){

await setDoc(

sellerRef,

{

uid:
sellerId,

shopName:
"مشتاق وليد",

phone:
"",

email:
"",

status:
"active",

subscription:
"free",

createdAt:
new Date()

}

);

}


/*
   البحث عن منتجات مشتاق
*/

const productsQuery =
query(

collection(db,"products"),

where(
"shopName",
"==",
"مشتاق وليد"
)

);

const productsSnap =
await getDocs(
productsQuery
);


/*
   ربط المنتجات
*/

let batch =
writeBatch(db);

let count = 0;


for(
const productDoc
of productsSnap.docs
){

batch.update(

doc(
db,
"products",
productDoc.id
),

{

sellerId:
sellerId,

shopName:
"مشتاق وليد"

}

);

count++;


if(count >= 450){

await batch.commit();

batch =
writeBatch(db);

count = 0;

}

}


if(count > 0){

await batch.commit();

}


/*
   نجاح
*/

showMessage(

"✅ تمت إضافة مشتاق وليد بنجاح.\n\n" +

"🏪 اسم التاجر: مشتاق وليد\n\n" +

"📦 تم ربط " +
productsSnap.size +
" منتج به.\n\n" +

"الآن تستطيع تعديل اسمه من إدارة البائعين.",

"success"

);


await loadSellers();


this.textContent =
"✅ تم إضافة مشتاق وليد";

}catch(error){

console.error(error);

showMessage(

"❌ حدث خطأ أثناء إضافة مشتاق وليد:\n\n" +

error.message,

"error"

);

this.disabled =
false;

this.textContent =
"➕ إضافة مشتاق وليد وربط منتجاته";

}

};


/* =====================================
   تحميل البائعين
===================================== */

async function loadSellers(){

sellersList.innerHTML =
"جاري تحميل البائعين...";

hideMessage();


try{

const snapshot =
await getDocs(
collection(db,"sellers")
);


if(snapshot.empty){

sellersList.innerHTML = `

<div class="empty">

👥 لا يوجد بائعون مسجلون.

</div>

`;

return;

}


sellersList.innerHTML = "";


snapshot.forEach(
sellerDoc=>{

const seller =
sellerDoc.data();

const sellerId =
sellerDoc.id;

const shopName =
seller.shopName ||
"بدون اسم";

const email =
seller.email ||
"-";

const phone =
seller.phone ||
"-";

const status =
seller.status ||
"active";

const subscription =
seller.subscription ||
"free";


let statusHTML = "";


if(status === "active"){

statusHTML = `
<span class="statusActive">
🟢 نشط
</span>
`;

}else if(status === "stopped"){

statusHTML = `
<span class="statusStopped">
🔴 متوقف مؤقتًا
</span>
`;

}else{

statusHTML = `
<span class="statusUnknown">
⚪ ${escapeHtml(status)}
</span>
`;

}


const card =
document.createElement("div");

card.className =
"sellerCard";


card.innerHTML = `

<div class="sellerName">

🏪 ${escapeHtml(shopName)}

</div>


<div class="info">

🆔 معرف البائع:

<br>

<small>
${escapeHtml(sellerId)}
</small>

<br><br>

📧 البريد:

${escapeHtml(email)}

<br>

📱 الجوال:

${escapeHtml(phone)}

<br>

📌 الحالة:

${statusHTML}

<br>

💳 الاشتراك:

${escapeHtml(subscription)}

</div>


<div class="divider"></div>


<button
class="edit"
data-id="${escapeHtml(sellerId)}"
>
✏️ تعديل اسم التاجر
</button>


<div
id="edit-${escapeHtml(sellerId)}"
style="display:none;margin-top:10px;"
>

<input
id="input-${escapeHtml(sellerId)}"
value="${escapeHtml(shopName)}"
placeholder="اسم التاجر أو البقالة"
>

<button
class="save"
data-save-id="${escapeHtml(sellerId)}"
>
💾 حفظ الاسم
</button>

</div>


${
status === "active"

?

`

<button
class="stop"
data-stop-id="${escapeHtml(sellerId)}"
>
⏸️ إيقاف البائع مؤقتًا
</button>

`

:

`

<button
class="activate"
data-activate-id="${escapeHtml(sellerId)}"
>
▶️ إعادة تفعيل البائع
</button>

`
}


<button
class="delete"
data-delete-id="${escapeHtml(sellerId)}"
>
🗑️ حذف البائع
</button>

`;


sellersList.appendChild(card);

});


/* =====================================
   فتح تعديل الاسم
===================================== */

document
.querySelectorAll(".edit")
.forEach(button=>{

button.onclick =
function(){

const id =
this.dataset.id;

const box =
document.getElementById(
"edit-" + id
);

if(box){

box.style.display =
box.style.display === "none"
? "block"
: "none";

}

};

});


/* =====================================
   حفظ اسم التاجر
===================================== */

document
.querySelectorAll("[data-save-id]")
.forEach(button=>{

button.onclick =
async function(){

const sellerId =
this.dataset.saveId;

const input =
document.getElementById(
"input-" + sellerId
);

if(!input){

return;

}

const newName =
input.value.trim();


if(!newName){

alert(
"⚠️ اكتب اسم التاجر أولًا"
);

return;

}


this.disabled =
true;

this.textContent =
"⏳ جاري الحفظ...";


try{

/*
   قراءة الاسم القديم
*/

const sellerRef =
doc(
db,
"sellers",
sellerId
);

const sellerSnap =
await getDoc(
sellerRef
);

const oldName =
sellerSnap.exists()
?
sellerSnap.data().shopName || ""
:
"";


/*
   تحديث اسم البائع
*/

await updateDoc(

sellerRef,

{

shopName:
newName

}

);


/*
   البحث بواسطة sellerId
*/

const bySeller =
query(

collection(db,"products"),

where(
"sellerId",
"==",
sellerId
)

);

const sellerProducts =
await getDocs(
bySeller
);


/*
   البحث أيضًا بالاسم القديم
*/

const productsMap =
new Map();


sellerProducts.forEach(
p=>{
productsMap.set(
p.id,
p
);
});


if(oldName){

const byName =
query(

collection(db,"products"),

where(
"shopName",
"==",
oldName
)

);

const oldProducts =
await getDocs(
byName
);


oldProducts.forEach(
p=>{

if(!productsMap.has(p.id)){

productsMap.set(
p.id,
p
);

}

});

}


/*
   تحديث المنتجات
*/

let batch =
writeBatch(db);

let count = 0;


for(
const productDoc
of productsMap.values()
){

batch.update(

doc(
db,
"products",
productDoc.id
),

{

shopName:
newName,

sellerId:
sellerId

}

);

count++;


if(count >= 450){

await batch.commit();

batch =
writeBatch(db);

count = 0;

}

}


if(count > 0){

await batch.commit();

}


/*
   نجاح
*/

showMessage(

"✅ تم تغيير اسم التاجر بنجاح.\n\n" +

"🏪 الاسم الجديد: " +
newName +

"\n\n" +

"📦 تم تحديث " +
productsMap.size +
" منتج.",

"success"

);


await loadSellers();


}catch(error){

console.error(error);

showMessage(

"❌ حدث خطأ أثناء تعديل الاسم:\n\n" +
error.message,

"error"

);

this.disabled =
false;

this.textContent =
"💾 حفظ الاسم";

}

};

});


/* =====================================
   إيقاف البائع
===================================== */

document
.querySelectorAll("[data-stop-id]")
.forEach(button=>{

button.onclick =
async function(){

const sellerId =
this.dataset.stopId;


if(!confirm(
"⚠️ هل تريد إيقاف هذا البائع مؤقتًا؟"
)){

return;

}


this.disabled =
true;

this.textContent =
"⏳ جاري الإيقاف...";


try{

await updateDoc(

doc(
db,
"sellers",
sellerId
),

{

status:
"stopped"

}

);


showMessage(
"⏸️ تم إيقاف البائع مؤقتًا بنجاح.",
"warning"
);


await loadSellers();


}catch(error){

console.error(error);

showMessage(

"❌ حدث خطأ:\n\n" +
error.message,

"error"

);

this.disabled =
false;

this.textContent =
"⏸️ إيقاف البائع مؤقتًا";

}

};

});


/* =====================================
   إعادة التفعيل
===================================== */

document
.querySelectorAll("[data-activate-id]")
.forEach(button=>{

button.onclick =
async function(){

const sellerId =
this.dataset.activateId;


if(!confirm(
"▶️ هل تريد إعادة تفعيل هذا البائع؟"
)){

return;

}


this.disabled =
true;

this.textContent =
"⏳ جاري التفعيل...";


try{

await updateDoc(

doc(
db,
"sellers",
sellerId
),

{

status:
"active"

}

);


showMessage(
"✅ تم إعادة تفعيل البائع.",
"success"
);


await loadSellers();


}catch(error){

console.error(error);

showMessage(

"❌ حدث خطأ:\n\n" +
error.message,

"error"

);

this.disabled =
false;

this.textContent =
"▶️ إعادة تفعيل البائع";

}

};

});


/* =====================================
   حذف البائع
===================================== */

document
.querySelectorAll("[data-delete-id]")
.forEach(button=>{

button.onclick =
async function(){

const sellerId =
this.dataset.deleteId;


if(!confirm(

"⚠️ تحذير\n\n" +

"سيتم حذف البائع ومنتجاته.\n\n" +

"هل تريد المتابعة؟"

)){

return;

}


if(!confirm(
"🗑️ تأكيد الحذف النهائي؟"
)){

return;

}


this.disabled =
true;

this.textContent =
"⏳ جاري الحذف...";


try{

const productsQuery =
query(

collection(db,"products"),

where(
"sellerId",
"==",
sellerId
)

);


const productsSnap =
await getDocs(
productsQuery
);


let batch =
writeBatch(db);

let count = 0;


for(
const productDoc
of productsSnap.docs
){

batch.delete(

doc(
db,
"products",
productDoc.id
)

);

count++;


if(count >= 450){

await batch.commit();

batch =
writeBatch(db);

count = 0;

}

}


if(count > 0){

await batch.commit();

}


await deleteDoc(

doc(
db,
"sellers",
sellerId
)

);


showMessage(

"🗑️ تم حذف البائع.\n\n" +

"📦 تم حذف " +
productsSnap.size +
" منتج.",

"success"

);


await loadSellers();


}catch(error){

console.error(error);

showMessage(

"❌ حدث خطأ أثناء الحذف:\n\n" +
error.message,

"error"

);

this.disabled =
false;

this.textContent =
"🗑️ حذف البائع";

}

};

});


}catch(error){

console.error(error);

sellersList.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل البائعين.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


/* =====================================
   حماية المدير
===================================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

alert(
"يجب تسجيل دخول المدير أولًا"
);

location.href =
"login.html";

return;

}


if(
!allowedEmails.includes(
user.email
)
){

alert(
"ليس لديك صلاحية دخول إدارة البائعين"
);

location.href =
"login.html";

return;

}


loadSellers();

});


/* =====================================
   حماية النصوص
===================================== */

function escapeHtml(text){

return String(
text ?? ""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

   </html>
