<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

html,body{
overflow-x:hidden;
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:15px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h2{
margin-bottom:12px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
background:#009688;
color:#fff;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#00796b;
}

.delete{
background:#e53935;
}

.status{
background:#ff9800;
}

.activate{
background:#009688;
}

.cancelEdit{
background:#757575;
}

.seller{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
border-right:5px solid #009688;
}

.product{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
overflow-wrap:anywhere;
}

.product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
margin-top:10px;
}

.active{
color:#008000;
font-weight:bold;
}

.inactive{
color:#e53935;
font-weight:bold;
}

.orderBox{
background:#fff;
padding:12px;
margin-bottom:12px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
border-right:5px solid #009688;
}

.orderHeader{
margin-bottom:8px;
line-height:1.8;
}

.orderInfo{
font-size:15px;
line-height:1.9;
}

.productsList{
background:#f5f5f5;
padding:8px;
margin-top:8px;
border-radius:8px;
}

.productOrder{
padding:7px 5px;
border-bottom:1px solid #ddd;
font-size:15px;
line-height:1.8;
}

.productOrder:last-child{
border-bottom:none;
}

.totalBox{
background:#e8f5e9;
padding:10px;
margin-top:10px;
border-radius:8px;
line-height:1.9;
font-size:15px;
}

.finalTotal{
font-size:19px;
font-weight:bold;
color:#00897b;
}

.deliveryBox{
background:#fff3e0;
padding:9px;
margin-top:8px;
border-radius:8px;
line-height:1.7;
font-size:14px;
}

hr{
border:none;
border-top:1px solid #ddd;
margin:8px 0;
}

</style>

</head>

<body>

<header>
🛠 لوحة إدارة سوق مباشر
</header>

<div class="container">

<!-- =========================
     إدارة البائعين
========================= -->

<div class="card">

<h2>👥 إدارة البائعين</h2>

<div id="sellers">
جاري تحميل البائعين...
</div>

</div>


<!-- =========================
     إضافة / تعديل منتج
========================= -->

<div class="card">

<h2 id="productFormTitle">
➕ إضافة منتج جديد
</h2>

<input
id="name"
placeholder="اسم المنتج"
>

<input
id="price"
type="number"
placeholder="سعر الكرتون"
>

<input
id="city"
placeholder="المدينة"
>

<input
id="phone"
placeholder="رقم التواصل"
>

<input
id="image"
placeholder="رابط الصورة"
>

<textarea
id="description"
placeholder="وصف المنتج"
></textarea>

<button id="saveBtn">
حفظ المنتج
</button>

<button
id="cancelEditBtn"
class="cancelEdit"
style="display:none;"
>
إلغاء التعديل
</button>

</div>


<!-- =========================
     المنتجات
========================= -->

<div class="card">

<h2>🛍️ المنتجات</h2>

<div id="products">
جاري تحميل المنتجات...
</div>

</div>


<!-- =========================
     الطلبات
========================= -->

<div class="card">

<h2>📦 طلبات الزبائن</h2>

<div id="orders">
جاري تحميل الطلبات...
</div>

</div>

</div>


<script type="module">

import { db, auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
addDoc,
getDocs,
getDoc,
deleteDoc,
updateDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   العناصر
===================================== */

const saveBtn =
document.getElementById("saveBtn");

const cancelEditBtn =
document.getElementById("cancelEditBtn");

const productFormTitle =
document.getElementById("productFormTitle");

const productsBox =
document.getElementById("products");

const ordersBox =
document.getElementById("orders");

const sellersBox =
document.getElementById("sellers");


/* =====================================
   حالة التعديل
===================================== */

let editingProductId = null;


/* =====================================
   البائعون
===================================== */

async function loadSellers(){

sellersBox.innerHTML =
"جاري تحميل البائعين...";

try{

const snap =
await getDocs(
collection(db,"sellers")
);

if(snap.empty){

sellersBox.innerHTML =
"<p>لا يوجد بائعون.</p>";

return;

}

sellersBox.innerHTML = "";

snap.forEach(item=>{

const seller =
item.data();

const sellerId =
item.id;

const status =
seller.status || "active";

const statusText =
status === "active"
? "🟢 نشط"
: "🔴 موقوف";

const statusClass =
status === "active"
? "active"
: "inactive";


sellersBox.innerHTML += `

<div class="seller">

<h3>
🏪 ${seller.shopName || "بدون اسم"}
</h3>

<p>
📧 البريد:
${seller.email || "-"}
</p>

<p>
📱 الجوال:
${seller.phone || "-"}
</p>

<p>
💳 الاشتراك:
${seller.subscription || "free"}
</p>

<p class="${statusClass}">
الحالة:
${statusText}
</p>

${
status === "active"

?

`
<button
class="delete"
onclick="changeSellerStatus(
'${sellerId}',
'inactive'
)"
>
🔴 إيقاف الحساب
</button>
`

:

`
<button
class="activate"
onclick="changeSellerStatus(
'${sellerId}',
'active'
)"
>
🟢 تفعيل الحساب
</button>
`
}

<button
class="delete"
onclick="deleteSeller('${sellerId}')"
>
🗑️ حذف البائع
</button>

</div>

`;

});

}catch(error){

console.error(error);

sellersBox.innerHTML =
"<p>حدث خطأ أثناء تحميل البائعين.</p>";

}

}


/* =====================================
   حذف البائع
===================================== */

window.deleteSeller =
async function(id){

if(
!confirm(
"⚠️ هل أنت متأكد من حذف هذا البائع؟"
)
){
return;
}

try{

await deleteDoc(
doc(db,"sellers",id)
);

alert(
"تم حذف البائع ✅"
);

loadSellers();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حذف البائع:\n" +
error.message
);

}

};


/* =====================================
   تغيير حالة البائع
===================================== */

window.changeSellerStatus =
async function(id,status){

const message =
status === "inactive"
? "هل تريد إيقاف هذا البائع؟"
: "هل تريد تفعيل هذا البائع؟";

if(!confirm(message)){
return;
}

try{

await updateDoc(
doc(db,"sellers",id),
{
status:status
}
);

alert(
status === "inactive"
? "تم إيقاف الحساب ✅"
: "تم تفعيل الحساب ✅"
);

loadSellers();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تغيير حالة الحساب"
);

}

};


/* =====================================
   المنتجات
===================================== */

async function loadProducts(){

productsBox.innerHTML =
"جاري تحميل المنتجات...";

try{

const snap =
await getDocs(
collection(db,"products")
);

if(snap.empty){

productsBox.innerHTML =
"<p>لا توجد منتجات.</p>";

return;

}

productsBox.innerHTML = "";

snap.forEach(item=>{

const data =
item.data();

productsBox.innerHTML += `

<div class="product">

<h3>
${data.name || ""}
</h3>

<p>
💰 سعر الكرتون:
${Number(data.price) || 0}
ريال
</p>

<p>
🏪 المتجر:
${data.shopName || "مشتاق وليد"}
</p>

<p>
🏙 المدينة:
${data.city || "-"}
</p>

${
data.image
?
`
<img
src="${data.image}"
alt="صورة المنتج"
>
`
:
""
}

<p>
${data.description || ""}
</p>

<button
onclick="editProduct('${item.id}')"
>
✏️ تعديل المنتج
</button>

<button
class="delete"
onclick="deleteProduct('${item.id}')"
>
🗑️ حذف المنتج
</button>

</div>

`;

});

}catch(error){

console.error(error);

productsBox.innerHTML =
"<p>حدث خطأ أثناء تحميل المنتجات.</p>";

}

}


/* =====================================
   تعديل المنتج
===================================== */

window.editProduct =
async function(id){

try{

const productRef =
doc(db,"products",id);

const snap =
await getDoc(productRef);

if(!snap.exists()){

alert(
"لم يتم العثور على المنتج"
);

return;

}

const productData =
snap.data();


/* تعبئة الخانات */

document.getElementById("name").value =
productData.name || "";

document.getElementById("price").value =
productData.price || "";

document.getElementById("city").value =
productData.city || "";

document.getElementById("phone").value =
productData.phone || "";

document.getElementById("image").value =
productData.image || "";

document.getElementById("description").value =
productData.description || "";


/* حفظ رقم المنتج */

editingProductId =
id;


/* تغيير الواجهة */

productFormTitle.innerText =
"✏️ تعديل المنتج";

saveBtn.innerText =
"💾 حفظ تعديل المنتج";

cancelEditBtn.style.display =
"block";


/* النزول إلى نموذج المنتج */

productFormTitle
.parentElement
.scrollIntoView({
behavior:"smooth"
});

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تحميل المنتج للتعديل:\n" +
error.message
);

}

};


/* =====================================
   إلغاء تعديل المنتج
===================================== */

cancelEditBtn.onclick =
function(){

editingProductId =
null;

productFormTitle.innerText =
"➕ إضافة منتج جديد";

saveBtn.innerText =
"حفظ المنتج";

cancelEditBtn.style.display =
"none";


document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("phone").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";

};


/* =====================================
   إضافة / تعديل المنتج
===================================== */

saveBtn.onclick =
async function(){

const name =
document
.getElementById("name")
.value
.trim();

const price =
document
.getElementById("price")
.value
.trim();

const city =
document
.getElementById("city")
.value
.trim();

const phone =
document
.getElementById("phone")
.value
.trim();

const image =
document
.getElementById("image")
.value
.trim();

const description =
document
.getElementById("description")
.value
.trim();


if(!name){

alert(
"اكتب اسم المنتج"
);

return;

}


try{


/* =====================================
   تعديل منتج موجود
===================================== */

if(editingProductId){

await updateDoc(
doc(
db,
"products",
editingProductId
),
{

name:name,

price:Number(price) || 0,

city:city,

phone:phone,

image:image,

description:description

}
);

alert(
"تم تعديل المنتج بنجاح ✅"
);


/* إنهاء وضع التعديل */

editingProductId =
null;

productFormTitle.innerText =
"➕ إضافة منتج جديد";

saveBtn.innerText =
"حفظ المنتج";

cancelEditBtn.style.display =
"none";


/* تنظيف الخانات */

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("phone").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";


loadProducts();

return;

}


/* =====================================
   إضافة منتج جديد
===================================== */

await addDoc(
collection(db,"products"),
{

name:name,

price:Number(price) || 0,

city:city,

phone:phone,

image:image,

description:description,

shopName:"مشتاق وليد"

}
);

alert(
"تم حفظ المنتج ✅"
);


/* تنظيف الخانات */

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("city").value="";
document.getElementById("phone").value="";
document.getElementById("image").value="";
document.getElementById("description").value="";

loadProducts();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حفظ المنتج:\n" +
error.message
);

}

};


/* =====================================
   حذف منتج
===================================== */

window.deleteProduct =
async function(id){

if(
!confirm(
"هل تريد حذف هذا المنتج؟"
)
){
return;
}

try{

await deleteDoc(
doc(db,"products",id)
);

alert(
"تم حذف المنتج ✅"
);

loadProducts();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حذف المنتج:\n" +
error.message
);

}

};


/* =====================================
   حساب رسوم الكرتون
   ⚠️ لم يتم تغيير الحسبة
===================================== */

function getDeliveryPerCarton(price){

price =
Number(price) || 0;

if(price < 1500){

return 50;

}

if(price < 2000){

return 70;

}

return 100;

}


/* =====================================
   الطلبات
===================================== */

async function loadOrders(){

ordersBox.innerHTML =
"جاري تحميل الطلبات...";

try{

const snap =
await getDocs(
collection(db,"orders")
);

if(snap.empty){

ordersBox.innerHTML =
"<p>لا توجد طلبات.</p>";

return;

}

ordersBox.innerHTML = "";

snap.forEach(item=>{

const data =
item.data();


/* ===============================
   بيانات العميل
=============================== */

const customerName =
data.name ||
data.customerName ||
"بدون اسم";

const customerPhone =
data.phone ||
data.customerPhone ||
"-";

const customerAddress =
data.address ||
data.customerAddress ||
"-";

const city =
data.customerCity ||
data.deliveryArea ||
"إب";

const orderType =
data.orderType ||
"جملة";

const deliveryTime =
data.deliveryTime ||
"غير محدد";


/* ===============================
   المنتجات
=============================== */

const products =
Array.isArray(data.products)
? data.products
: [];


let productsHTML = "";

let calculatedDelivery = 0;

let calculatedCartons = 0;

let calculatedProductsTotal = 0;


products.forEach(product=>{

const name =
product.name ||
"منتج";

const price =
Number(product.price) || 0;


/*
إذا لم توجد كمية
نعتبر كل منتج كرتونًا واحدًا.
*/

const quantity =
Number(product.quantity) > 0
? Number(product.quantity)
: 1;


/* قيمة المنتج */

const productTotal =
price * quantity;


/* رسوم التوصيل */

const deliveryPerCarton =
getDeliveryPerCarton(price);

const productDelivery =
deliveryPerCarton * quantity;


/* التجميع */

calculatedCartons +=
quantity;

calculatedProductsTotal +=
productTotal;

calculatedDelivery +=
productDelivery;


/* عرض المنتج */

productsHTML += `

<div class="productOrder">

🛍️ <strong>${name}</strong>

<br>

📦 الكراتين:
<strong>${quantity}</strong>

&nbsp;&nbsp;

💰 سعر الكرتون:
<strong>${price} ريال</strong>

</div>

`;

});


/* ===============================
   الإجماليات
=============================== */

const productsTotal =
calculatedProductsTotal;

const deliveryTotal =
calculatedDelivery;

const total =
productsTotal +
deliveryTotal;


/* ===============================
   الحالة
=============================== */

const status =
data.status ||
"جديد";
const createdAt =
data.createdAt?.toDate
? data.createdAt.toDate()
: null;

const createdAtText =
createdAt
? createdAt.toLocaleString("ar-SA", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  })
: "غير متوفر";
let statusButton = "";


if(status === "تم التوصيل"){

statusButton = `

<p style="
background:#e8f5e9;
color:#008000;
padding:8px;
border-radius:8px;
font-weight:bold;
text-align:center;
margin-top:8px;
">

✅ تم التوصيل

</p>

`;

}else{

statusButton = `

<button
class="status"
onclick="changeStatus('${item.id}')"
>

🚚 تغيير الحالة إلى تم التوصيل

</button>

`;

}


/* ===============================
   عرض الطلب
=============================== */

ordersBox.innerHTML += `

<div class="orderBox">

<div class="orderHeader">

<h3>
👤 ${customerName}
</h3>
<p>
🕐 <strong>وقت إنشاء الطلب:</strong>
${createdAtText}
</p>
</div>

<div class="orderInfo">

📱 الجوال:
${customerPhone}

<br>

📍 المدينة:
${city}

<br>

🏠 العنوان:
${customerAddress}

<br>

📦 نوع الطلب:
${orderType}

<br>

🕐 وقت التوصيل:
${deliveryTime}

</div>


<hr>


<strong>
🛒 المنتجات:
</strong>


<div class="productsList">

${
productsHTML ||
"<p>لا توجد منتجات</p>"
}

</div>


<div class="totalBox">

📦 <strong>
إجمالي الكراتين:
</strong>

${calculatedCartons}

<br>

🛍️ <strong>
مجموع المنتجات:
</strong>

${productsTotal} ريال

<br>

🚚 <strong>
إجمالي التوصيل:
</strong>

${deliveryTotal} ريال

<hr>

<span class="finalTotal">

💰 الإجمالي النهائي:
${total} ريال

</span>

</div>


<div class="deliveryBox">

📋 <strong>
حالة الطلب:
</strong>

${status}

</div>


${statusButton}


<button
class="delete"
onclick="deleteOrder('${item.id}')"
>

🗑️ حذف الطلب

</button>


</div>

`;

});

}catch(error){

console.error(error);

ordersBox.innerHTML = `

<p>
حدث خطأ أثناء تحميل الطلبات.
</p>

<p>
${error.message}
</p>

`;

}

}


/* =====================================
   حذف الطلب
===================================== */

window.deleteOrder =
async function(id){

if(
!confirm(
"هل تريد حذف هذا الطلب؟"
)
){
return;
}

try{

await deleteDoc(
doc(db,"orders",id)
);

alert(
"تم حذف الطلب ✅"
);

loadOrders();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء حذف الطلب:\n" +
error.message
);

}

};


/* =====================================
   تغيير حالة الطلب
===================================== */

window.changeStatus =
async function(id){

try{

await updateDoc(
doc(db,"orders",id),
{
status:"تم التوصيل"
}
);

alert(
"تم تغيير حالة الطلب إلى تم التوصيل ✅"
);

loadOrders();

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تغيير حالة الطلب"
);

}

};


/* =====================================
   تشغيل لوحة الإدارة
===================================== */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

alert(
"يجب تسجيل دخول المدير أولاً"
);

return;

}


if(
user.email !==
"waleedahmad2031@gmail.com"
){

alert(
"ليس لديك صلاحية دخول لوحة الإدارة"
);

return;

}


loadSellers();

loadProducts();

loadOrders();

});

</script>

</body>

   </html>
