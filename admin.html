<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:20px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
margin-bottom:18px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:8px;
}

.description{
color:#666;
line-height:1.7;
margin-bottom:12px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:9px;
font-size:18px;
cursor:pointer;
color:#fff;
background:#009688;
}

button:hover{
background:#00796b;
}

.products{
background:#009688;
}

.orders{
background:#ff9800;
}

.archive{
background:#673ab7;
}

.sellers{
background:#3f51b5;
}

.logout{
background:#e53935;
}

</style>

</head>

<body>

<header>
🛠 لوحة إدارة سوق مباشر
</header>

<div class="container">


<!-- =========================
     إضافة المنتجات
========================= -->

<div class="card">

<div class="title">
➕ إضافة المنتجات
</div>

<div class="description">
إضافة وتعديل وحذف المنتجات.
</div>

<button
class="products"
onclick="location.href='products.html'"
>
➕ فتح قسم إضافة المنتجات
</button>

</div>


<!-- =========================
     الطلبات
========================= -->

<div class="card">

<div class="title">
📦 طلبات الزبائن
</div>

<div class="description">
عرض ومتابعة الطلبات الحالية.
</div>

<button
class="orders"
onclick="location.href='admin-orders.html'"
>
📦 فتح طلبات الزبائن
</button>

</div>


<!-- =========================
     الأرشيف
========================= -->

<div class="card">

<div class="title">
📚 أرشيف الطلبات
</div>

<div class="description">
الطلبات التي تم إنهاؤها ونقلها إلى الأرشيف.
</div>

<button
class="archive"
onclick="location.href='archive.html'"
>
📚 فتح الأرشيف
</button>

</div>


<!-- =========================
     البائعون
========================= -->

<div class="card">

<div class="title">
👥 إدارة البائعين
</div>

<div class="description">
إدارة حسابات البائعين وحالتهم.
</div>

<button
class="sellers"
onclick="location.href='admin-sellers.html'"
>
👥 فتح إدارة البائعين
</button>

</div>


<!-- =========================
     تسجيل الخروج
========================= -->

<div class="card">

<button
class="logout"
onclick="logoutAdmin()"
>
🚪 تسجيل الخروج
</button>

</div>


</div>


<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   التأكد من دخول المدير
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

alert(
"يجب تسجيل دخول المدير أولاً"
);

location.href="login.html";

return;

}


const allowedEmails = [

"waleedahmad@gmail.com",

"waleedahmadahmad@gmail.com",

"waleedahmad2031@gmail.com"

];


if(
!allowedEmails.includes(
user.email
)
){

alert(
"ليس لديك صلاحية دخول لوحة الإدارة"
);

signOut(auth);

location.href="login.html";

return;

}

});


/* =========================
   تسجيل الخروج
========================= */

window.logoutAdmin =
async function(){

try{

await signOut(auth);

location.href="login.html";

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تسجيل الخروج"
);

}

};

</script>

</body>

</html>
