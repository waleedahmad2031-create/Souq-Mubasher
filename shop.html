<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوق مباشر</title>

<style>

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{
background:#009688;
color:#fff;
padding:15px;
text-align:center;
font-size:24px;
}

.banner{
background:#00796b;
color:white;
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
overflow:hidden;
}

.slide{
display:none;
animation:fade 1s;
}

.slide span{
font-size:16px;
font-weight:normal;
}

.slide:first-child{
display:block;
}

@keyframes fade{

from{
opacity:0;
}

to{
opacity:1;
}

}


#products{
padding:15px;
display:grid;
gap:15px;
}


.product{
background:#fff;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
text-align:center;
}


.product img{
width:150px;
height:150px;
object-fit:cover;
border-radius:10px;
}


</style>

</head>


<body>


<header>

🛒 سوق مباشر


<a href="cart.html" style="
display:block;
margin-top:10px;
color:white;
text-decoration:none;
font-size:18px;
">

🛍️ اختر منتجاتك ثم اضغط هنا (<span id="cartCount">0</span>)

</a>


</header>



<div class="banner">


<div class="slide">

🛒 سوق مباشر

<br>

<span>
كل احتياجاتك في مكان واحد
</span>

</div>



<div class="slide">

🚚 تسوق بسهولة

<br>

<span>
اطلب منتجاتك ونحن نسهل لك الوصول إليها
</span>

</div>



<div class="slide">

⭐ خيارات أكثر... وقت أقل

<br>

<span>
منتجات متنوعة وأسعار مناسبة
</span>

</div>


</div>




<div id="products">

جاري تحميل المنتجات...

</div>




<script type="module" src="app.js"></script>



<script>


function updateCartCount(){


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let count = document.getElementById("cartCount");


if(count){

count.innerText = cart.length;

}


}


updateCartCount();




let slides = document.querySelectorAll(".slide");

let index = 0;



setInterval(()=>{


slides[index].style.display="none";


index++;


if(index >= slides.length){

index=0;

}


slides[index].style.display="block";



},3000);



</script>



</body>

</html>
