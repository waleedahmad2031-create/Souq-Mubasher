<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>سلة التسوق | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.item{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
display:flex;
gap:15px;
align-items:center;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

.info{
flex:1;
}

.info h3{
margin-bottom:10px;
}

.info p{
margin:5px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.delete{
background:#e53935;
color:#fff;
}

.total{
background:#fff;
padding:15px;
border-radius:10px;
font-size:20px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.orderBtn{
width:100%;
margin-top:20px;
padding:15px;
background:#009688;
color:#fff;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
}

.orderBtn:hover{
background:#00796b;
}

</style>

</head>

<body>

<header>
🛒 سلة التسوق
</header>

<div class="container">

<div id="cartItems">

</div>

<div class="total">
الإجمالي:
<span id="totalPrice">0</span>
ريال
</div>

<button class="orderBtn" id="sendOrder">
إرسال الطلب
</button>
<script type="module">

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cartItems");
const totalPrice = document.getElementById("totalPrice");

function renderCart(){

cartItems.innerHTML="";

let total=0;

if(cart.length===0){

cartItems.innerHTML=`
<div class="item">
<h3>السلة فارغة</h3>
</div>
`;

totalPrice.textContent="0";
return;

}

cart.forEach((item,index)=>{

total += Number(item.price);

cartItems.innerHTML += `

<div class="item">

<img src="${item.image}" alt="">

<div class="info">

<h3>${item.name}</h3>

<p>السعر: ${item.price} ريال</p>

<p>${item.city || ""}</p>

<button class="delete" onclick="removeItem(${index})">
حذف
</button>

</div>

</div>

`;

});

totalPrice.textContent = total;

}

window.removeItem=function(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

renderCart();

};

document.getElementById("sendOrder").onclick=function(){

if(cart.length===0){

alert("السلة فارغة");

return;

}

location.href="orders.html";

};

renderCart();

</script>

</div>

</body>

</html>
