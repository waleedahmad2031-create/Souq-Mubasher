<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>سلة التسوق | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.shopBox{
background:#e8f5e9;
padding:15px;
border-radius:10px;
margin-bottom:15px;
color:#00695c;
font-weight:bold;
font-size:17px;
text-align:center;
}

.warning{
background:#ffebee;
color:#c62828;
padding:15px;
border-radius:10px;
margin-bottom:15px;
line-height:1.8;
font-weight:bold;
}

.item{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
display:flex;
gap:15px;
align-items:center;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

.info{
flex:1;
}

.info h3{
margin-bottom:10px;
}

.info p{
margin:5px 0;
}

.quantityBox{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

.quantityBox button{
width:40px;
height:40px;
padding:0;
font-size:22px;
font-weight:bold;
background:#009688;
color:white;
border:none;
border-radius:6px;
}

.quantity{
font-size:20px;
font-weight:bold;
min-width:35px;
text-align:center;
}

.delete{
background:#e53935 !important;
color:#fff;
padding:10px 15px !important;
width:auto !important;
height:auto !important;
font-size:16px !important;
}

.summary{
background:#fff;
padding:18px;
border-radius:10px;
margin-top:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.summary p{
margin:10px 0;
font-size:18px;
}

.delivery{
color:#009688;
font-weight:bold;
}

.deliveryDetails{
background:#f1f8f7;
padding:12px;
border-radius:8px;
font-size:15px !important;
line-height:1.9;
}

.finalTotal{
font-size:22px !important;
font-weight:bold;
border-top:1px solid #ddd;
padding-top:12px;
}

.note{
background:#e8f5e9;
padding:12px;
border-radius:8px;
margin-top:12px;
font-size:15px;
line-height:1.8;
}

.orderBtn{
width:100%;
margin-top:20px;
padding:15px;
background:#009688;
color:#fff;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
}

.orderBtn:hover{
background:#00796b;
}

.orderBtn:disabled{
background:#999;
cursor:not-allowed;
}

@media(max-width:600px){

.item{
align-items:flex-start;
}

.item img{
width:80px;
height:80px;
}

}

</style>

</head>

<body>

<header>
🛒 سلة التسوق
</header>

<div class="container">

<div id="shopBox" class="shopBox"></div>

<div id="warning"></div>

<div id="cart"></div>

<div class="summary">

<p>
🛍️ مجموع المنتجات:
<strong>
<span id="productsTotal">0</span> ريال
</strong>
</p>

<p class="delivery">
🚚 رسوم توصيل الجملة:
<strong>
<span id="deliveryTotal">0</span> ريال
</strong>
</p>

<div class="deliveryDetails">
🚚 يتم حساب التوصيل حسب سعر الكرتون وعدد الكراتين.
</div>

<p class="finalTotal">
💰 الإجمالي النهائي:
<strong>
<span id="totalPrice">0</span> ريال
</strong>
</p>

<div class="note">

📍 التوصيل داخل مدينة إب

<br>

🏪 كل طلب في النسخة الأولى يكون من تاجر واحد فقط.

</div>

</div>

<button class="orderBtn" id="sendOrder">
إتمام طلب الجملة
</button>

</div>


<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];


const cartItems =
document.getElementById("cart");

const productsTotal =
document.getElementById("productsTotal");

const deliveryTotal =
document.getElementById("deliveryTotal");

const totalPrice =
document.getElementById("totalPrice");

const shopBox =
document.getElementById("shopBox");

const warning =
document.getElementById("warning");

const sendOrder =
document.getElementById("sendOrder");


// ===============================
// حساب رسوم توصيل الكرتون
// ===============================

function getDeliveryFee(price){

price = Number(price || 0);

if(price < 1500){
return 50;
}

if(price < 2000){
return 70;
}

return 100;

}


// ===============================
// فحص التاجر
// ===============================

function checkSingleShop(){

if(cart.length === 0){

return {
valid:true,
shop:""
};

}


const firstShop =
String(
cart[0].shopName || ""
).trim();


const differentShop =
cart.find(item => {

const shop =
String(
item.shopName || ""
).trim();

return shop !== firstShop;

});


if(differentShop){

return {
valid:false,
shop:""
};

}


return {
valid:true,
shop:firstShop || "سوق مباشر"
};

}


// ===============================
// عرض السلة
// ===============================

function renderCart(){

cartItems.innerHTML = "";

warning.innerHTML = "";

shopBox.innerHTML = "";

let total = 0;

let delivery = 0;


if(cart.length === 0){

shopBox.innerHTML =
"🛒 لا يوجد تاجر محدد حاليًا";


cartItems.innerHTML = `

<div class="item">

<h3>
السلة فارغة
</h3>

</div>

`;

productsTotal.textContent = "0";

deliveryTotal.textContent = "0";

totalPrice.textContent = "0";

sendOrder.disabled = true;

return;

}


// ===============================
// فحص التاجر
// ===============================

const shopCheck =
checkSingleShop();


if(!shopCheck.valid){

warning.innerHTML = `

⚠️ السلة تحتوي على منتجات من أكثر من تاجر.

<br><br>

في النسخة الأولى:
<strong>
كل طلب يجب أن يكون من تاجر واحد فقط.
</strong>

<br><br>

احذف منتجات التاجر المختلف حتى تتمكن من إتمام الطلب.

`;

sendOrder.disabled = true;

shopBox.innerHTML =
"⚠️ يوجد أكثر من تاجر في السلة";

}else{

shopBox.innerHTML =

"🏪 التاجر الحالي: " +

"<strong>" +

escapeHtml(
shopCheck.shop
) +

"</strong>";

sendOrder.disabled = false;

}


// ===============================
// عرض المنتجات
// ===============================

cart.forEach((item,index)=>{

const quantity =
Number(
item.quantity || 1
);

const price =
Number(
item.price || 0
);


total +=
price * quantity;


const feePerCarton =
getDeliveryFee(price);


delivery +=
feePerCarton * quantity;


cartItems.innerHTML += `

<div class="item">

<img
src="${item.image || ''}"
alt="${escapeHtml(item.name || 'منتج')}"
>

<div class="info">

<h3>
${escapeHtml(item.name || '')}
</h3>

<p>
🏪 التاجر:
<strong>
${escapeHtml(item.shopName || 'سوق مباشر')}
</strong>
</p>

<p>
سعر الكرتون:
<strong>
${price.toLocaleString()} ريال
</strong>
</p>

<p>
🚚 توصيل الكرتون:
<strong>
${feePerCarton} ريال
</strong>
</p>

<p>
📦 عدد الكراتين:
<strong>
${quantity}
</strong>
</p>

<div class="quantityBox">

<button
onclick="decreaseQuantity(${index})"
>
−
</button>

<span class="quantity">
${quantity}
</span>

<button
onclick="increaseQuantity(${index})"
>
+
</button>

</div>

<br>

<button
class="delete"
onclick="removeItem(${index})"
>
حذف
</button>

</div>

</div>

`;

});


const finalTotal =
total + delivery;


productsTotal.textContent =
total.toLocaleString();

deliveryTotal.textContent =
delivery.toLocaleString();

totalPrice.textContent =
finalTotal.toLocaleString();

}


// ===============================
// زيادة الكمية
// ===============================

window.increaseQuantity =
function(index){

cart[index].quantity =
Number(
cart[index].quantity || 1
) + 1;


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


renderCart();

};


// ===============================
// إنقاص الكمية
// ===============================

window.decreaseQuantity =
function(index){

let quantity =
Number(
cart[index].quantity || 1
);


if(quantity > 1){

cart[index].quantity =
quantity - 1;

}else{

cart.splice(index,1);

}


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


renderCart();

};


// ===============================
// حذف المنتج
// ===============================

window.removeItem =
function(index){

cart.splice(index,1);


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


renderCart();

};


// ===============================
// إتمام الطلب
// ===============================

sendOrder.onclick =
function(){

if(cart.length === 0){

alert(
"السلة فارغة"
);

return;

}


const shopCheck =
checkSingleShop();


if(!shopCheck.valid){

alert(
"⚠️ لا يمكن إتمام الطلب من أكثر من تاجر في نفس الطلب."
);

return;

}


localStorage.setItem(
"selectedShop",
shopCheck.shop
);


location.href =
"orders.html";

};


// ===============================
// حماية HTML
// ===============================

function escapeHtml(text){

return String(text ?? "")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


// ===============================
// تشغيل
// ===============================

renderCart();

</script>

</body>

</html>
