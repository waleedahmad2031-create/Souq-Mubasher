<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>سلة التسوق | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.item{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
display:flex;
gap:15px;
align-items:center;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

.info{
flex:1;
}

.info h3{
margin-bottom:10px;
}

.info p{
margin:5px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.delete{
background:#e53935;
color:#fff;
}

.summary{
background:#fff;
padding:18px;
border-radius:10px;
margin-top:20px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.summary p{
margin:10px 0;
font-size:18px;
}

.delivery{
color:#009688;
font-weight:bold;
}

.finalTotal{
font-size:22px !important;
font-weight:bold;
border-top:1px solid #ddd;
padding-top:12px;
}

.note{
background:#e8f5e9;
padding:12px;
border-radius:8px;
margin-top:12px;
font-size:15px;
line-height:1.8;
}

.orderBtn{
width:100%;
margin-top:20px;
padding:15px;
background:#009688;
color:#fff;
font-size:20px;
border:none;
border-radius:10px;
cursor:pointer;
}

.orderBtn:hover{
background:#00796b;
}

</style>
</head>

<body>

<header>
🛒 سلة التسوق
</header>

<div class="container">

<div id="cart"></div>

<div class="summary">

<p>
🛍️ مجموع المنتجات:
<strong>
<span id="productsTotal">0</span> ريال
</strong>
</p>

<p class="delivery">
🚚 التوصيل بالجملة داخل إب
</p>

<p class="finalTotal">
💰 إجمالي المنتجات:
<strong>
<span id="totalPrice">0</span> ريال
</strong>
</p>

<div class="note">
📍 التوصيل متوفر داخل مدينة إب.

<br>

🌙 التوصيل المسائي:
من بعد المغرب حتى الساعة 10 مساءً.

<br>

☀️ الفترة الصباحية مخصصة للمشاوير والتوصيلات الأخرى.

<br>

📦 طلبات الجملة يتم التنسيق بشأن التوصيل عند تأكيد الطلب.
</div>

</div>

<button class="orderBtn" id="sendOrder">
إتمام الطلب
</button>

</div>

<script type="module">

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cart");
const productsTotal = document.getElementById("productsTotal");
const totalPrice = document.getElementById("totalPrice");

function renderCart(){

cartItems.innerHTML="";

let total = 0;

if(cart.length === 0){

cartItems.innerHTML = `

<div class="item">

<h3>
السلة فارغة
</h3>

</div>

`;

productsTotal.textContent="0";
totalPrice.textContent="0";

return;

}

cart.forEach((item,index)=>{

total += Number(item.price || 0);

cartItems.innerHTML += `

<div class="item">

<img src="${item.image || ''}">

<div class="info">

<h3>${item.name || ''}</h3>

<p>
السعر: ${item.price || 0} ريال
</p>

<p>
${item.city || ""}
</p>

<button class="delete" onclick="removeItem(${index})">
حذف
</button>

</div>

</div>

`;

});

productsTotal.textContent = total;
totalPrice.textContent = total;

}

window.removeItem=function(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

};

document.getElementById("sendOrder").onclick=function(){

if(cart.length===0){

alert("السلة فارغة");

return;

}

location.href="orders.html";

};

renderCart();

</script>

</body>
</html>
