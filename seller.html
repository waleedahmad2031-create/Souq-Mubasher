<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة البائع | سوق مباشر</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0b7a75;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
max-width:1000px;
margin:20px auto;
padding:15px;
}

.card{
background:#fff;
border-radius:12px;
padding:20px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
margin-bottom:10px;
color:#0b7a75;
}

.info{
font-size:17px;
margin:8px 0;
}

button{
background:#0b7a75;
color:#fff;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-top:10px;
}

button:hover{
opacity:.9;
}
</style>

</head>

<body>

<header>
لوحة تحكم البائع
</header>

<div class="container">

<div class="card">
<h2>مرحبًا بك</h2>
<div class="info">
اسم المتجر:
<span id="shopName">...</span>
</div>

<div class="info">
حالة الاشتراك:
<span id="subscription">...</span>
</div>

<div class="info">
عدد المنتجات:
<span id="productsCount">0</span>
</div>

<div class="info">
عدد الطلبات:
<span id="ordersCount">0</span>
</div>

<button onclick="location.href='add-product.html'">
إضافة منتج
</button>

<div class="card">
<h2>منتجاتي</h2>

<div id="productsList" class="products-grid">
<p>جاري تحميل المنتجات...</p>
</div>

</div>

</div>
<style>
.products-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

.product-card{
background:#fff;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.product-card img{
width:100%;
height:170px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.product-card h3{
font-size:18px;
margin-bottom:8px;
}

.product-card p{
margin:5px 0;
}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
}
</style>



<script type="module" src="seller-auth.js?v=2"></script>

</body>
</html>
