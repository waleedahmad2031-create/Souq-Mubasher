<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>طلبات الزبائن | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
overflow-x:hidden;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:18px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.title{
font-size:21px;
font-weight:bold;
margin-bottom:8px;
}

.description{
color:#666;
line-height:1.7;
margin-bottom:12px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
color:#fff;
}

button:disabled{
background:#999 !important;
cursor:not-allowed;
}

.back{

}

.orderBox{

padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
border-right:5px solid #009688;
}

.orderHeader{
line-height:1.9;
margin-bottom:10px;
}

.orderInfo{
font-size:15px;
line-height:2;
}

.sellerBox{
background:#e0f2f1;
color:#00695c;
padding:12px;
margin:10px 0;
border-radius:8px;
font-size:17px;
font-weight:bold;
}

.productsList{
background:#f5f5f5;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.productOrder{
padding:8px 5px;
border-bottom:1px solid #ddd;
line-height:1.8;
}

.productOrder:last-child{
border-bottom:none;
}

.totalBox{
background:#e8f5e9;
padding:12px;
margin-top:10px;
border-radius:8px;
line-height:2;
}

.finalTotal{
font-size:20px;
font-weight:bold;
color:#00897b;
}

.deliveryBox{
background:#fff3e0;
padding:12px;
margin-top:10px;
border-radius:8px;
line-height:1.8;
}

.deliveryChoose{
background:#e3f2fd;
padding:15px;
margin-top:12px;
border-radius:10px;
}

.deliveryTitle{
font-size:18px;
font-weight:bold;
color:#1565c0;
margin-bottom:10px;
}

.deliveryButton{
margin-top:8px;
font-weight:bold;
}

.near{
background:#43a047;
}

.medium{
background:#fb8c00;
}

.far{
background:#e53935;
}

.selectedDelivery{
background:#dcedc8;
color:#33691e;
padding:10px;
border-radius:8px;
margin-top:10px;
font-weight:bold;
text-align:center;
}

.whatsapp{
background:#25D366;
}

.status{
background:#ff9800;
}

.archive{
background:#5e35b1;
}

.delete{
background:#e53935;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

hr{
border:none;
border-top:1px solid #ddd;
margin:10px 0;
}

</style>

</head>

<body>

<div class="card">

<div class="title">
📊 إحصائيات المنتجات
</div>

<div class="description">
عرض مشاهدات المنتجات وعدد مرات إضافتها إلى السلة.
</div>

<button
style="background:#00897b;"
onclick="location.href='product-stats.html'"
>
📊 فتح إحصائيات المنتجات
</button>

</div>

<header>
📦 طلبات الزبائن
</header>

<div class="container">

<div class="card">

<button
class="back"
onclick="location.href='admin.html'"
>
⬅️ العودة إلى لوحة الإدارة
</button>

<div id="orders">
جاري تحميل الطلبات...
</div>

</div>

</div>

<script type="module">

import { db, auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
getDocs,
getDoc,
deleteDoc,
updateDoc,
setDoc,
doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const ordersBox =
document.getElementById("orders");


/* =====================================
   تحميل الطلبات
===================================== */

async function loadOrders(){

ordersBox.innerHTML =
"جاري تحميل الطلبات...";

try{

const snap =
await getDocs(
collection(db,"orders")
);

if(snap.empty){

ordersBox.innerHTML = `

<div class="empty">

📦 لا توجد طلبات حالية.

</div>

`;

return;

}

ordersBox.innerHTML = "";

const orders =
snap.docs.sort((a,b)=>{

const dateA =
a.data().createdAt?.toDate
? a.data().createdAt.toDate().getTime()
: 0;

const dateB =
b.data().createdAt?.toDate
? b.data().createdAt.toDate().getTime()
: 0;

return dateB - dateA;

});


orders.forEach(item=>{

const data =
item.data();


const customerName =
data.customerName ||
data.name ||
"بدون اسم";


const customerPhone =
data.customerPhone ||
data.phone ||
"-";


const customerAddress =
data.customerAddress ||
data.address ||
"-";


const city =
data.customerCity ||
data.deliveryArea ||
"إب";


const orderType =
data.orderType ||
"جملة";


const deliveryTime =
data.deliveryTime ||
"غير محدد";


const shopName =
data.shopName ||
(
data.products &&
data.products.length > 0
? data.products[0].shopName
: ""
) ||
"سوق مباشر";


const products =
Array.isArray(data.products)
? data.products
: [];


let productsHTML = "";

let calculatedCartons = 0;

let calculatedProductsTotal = 0;


products.forEach(product=>{

const name =
product.name ||
"منتج";


const price =
Number(product.price) || 0;


const quantity =
Number(product.quantity) > 0
? Number(product.quantity)
: 1;


const productTotal =
price * quantity;


calculatedCartons +=
quantity;


calculatedProductsTotal +=
productTotal;


productsHTML += `

<div class="productOrder">

🛍️ <strong>
${escapeHtml(name)}
</strong>

<br>

📦 الكراتين:
<strong>
${quantity}
</strong>

<br>

💰 سعر الكرتون:
<strong>
${price.toLocaleString()} ريال
</strong>

<br>

💵 إجمالي المنتج:
<strong>
${productTotal.toLocaleString()} ريال
</strong>

</div>

`;

});


const productsTotal =
calculatedProductsTotal;


const savedDeliveryFee =
Number(data.deliveryFee) || 0;


const total =
productsTotal +
savedDeliveryFee;


const createdAt =
data.createdAt?.toDate
? data.createdAt.toDate()
: null;


const createdAtText =
createdAt
? createdAt.toLocaleString(
"ar-SA",
{
year:"numeric",
month:"long",
day:"numeric",
hour:"numeric",
minute:"2-digit"
}
)
: "غير متوفر";


const status =
data.status ||
"جديد";


let statusButton = "";


if(status === "تم التوصيل"){

statusButton = `

<p style="
background:#e8f5e9;
color:#008000;
padding:10px;
border-radius:8px;
font-weight:bold;
text-align:center;
margin-top:10px;
">

✅ تم التوصيل

</p>

<button
class="archive"
onclick="archiveOrder('${item.id}')"
>

📚 نقل الطلب إلى الأرشيف

</button>

`;

}else{

statusButton = `

<button
class="status"
onclick="changeStatus('${item.id}')"
>

🚚 تغيير الحالة إلى تم التوصيل

</button>

`;

}


let deliveryStatusHTML = "";


if(savedDeliveryFee === 300){

deliveryStatusHTML = `

<div class="selectedDelivery">

🟢 تم تحديد التوصيل: قريب — 300 ريال

</div>

`;

}

else if(savedDeliveryFee === 500){

deliveryStatusHTML = `

<div class="selectedDelivery">

🟡 تم تحديد التوصيل: متوسط — 500 ريال

</div>

`;

}

else if(savedDeliveryFee === 700){

deliveryStatusHTML = `

<div class="selectedDelivery">

🔴 تم تحديد التوصيل: بعيد — 700 ريال

</div>

`;

}

else{

deliveryStatusHTML = `

<div class="selectedDelivery">

⏳ لم يتم تحديد رسوم التوصيل بعد

</div>

`;

}


/* =====================================
   زر واتساب
===================================== */

let whatsappButton = "";


if(
savedDeliveryFee === 300 ||
savedDeliveryFee === 500 ||
savedDeliveryFee === 700
){

whatsappButton = `

<button
class="whatsapp"
onclick="sendFinalWhatsApp(
'${item.id}',
'${encodeURIComponent(customerPhone)}'
)"
>

📲 إرسال الإجمالي للزبون عبر واتساب

</button>

`;

}


/* =====================================
   عرض الطلب
===================================== */

ordersBox.innerHTML += `

<div class="orderBox">

<div class="orderHeader">

<h3>

👤 ${escapeHtml(customerName)}

</h3>

<p>

🕐 <strong>
وقت إنشاء الطلب:
</strong>

${createdAtText}

</p>

</div>


<div class="sellerBox">

🏪 التاجر:

<strong>
${escapeHtml(shopName)}
</strong>

</div>


<div class="orderInfo">

📱 الجوال:

${escapeHtml(customerPhone)}

<br>

📍 المدينة:

${escapeHtml(city)}

<br>

🏠 الحي:

<strong>
${escapeHtml(customerAddress)}
</strong>

<br>

📦 نوع الطلب:

${escapeHtml(orderType)}

<br>

🕐 وقت التوصيل:

${escapeHtml(deliveryTime)}

</div>


<hr>


<strong>
🛒 المنتجات:
</strong>


<div class="productsList">

${
productsHTML ||
"<p>لا توجد منتجات</p>"
}

</div>


<div class="deliveryChoose">

<div class="deliveryTitle">

🚚 تحديد رسوم التوصيل

</div>


<div>

الحي:
<strong>
${escapeHtml(customerAddress)}
</strong>

</div>


<button
class="deliveryButton near"
onclick="setDelivery('${item.id}',300,'قريب')"
>

🟢 قريب — 300 ريال

</button>


<button
class="deliveryButton medium"
onclick="setDelivery('${item.id}',500,'متوسط')"
>

🟡 متوسط — 500 ريال

</button>


<button
class="deliveryButton far"
onclick="setDelivery('${item.id}',700,'بعيد')"
>

🔴 بعيد — 700 ريال

</button>


${deliveryStatusHTML}

</div>


<div class="totalBox">

📦 <strong>
إجمالي الكراتين:
</strong>

${calculatedCartons}

<br>

🛍️ <strong>
مجموع المنتجات:
</strong>

${productsTotal.toLocaleString()} ريال

<br>

🚚 <strong>
رسوم التوصيل:
</strong>

${savedDeliveryFee.toLocaleString()} ريال

<hr>

<span class="finalTotal">

💰 الإجمالي النهائي:

${total.toLocaleString()} ريال

</span>

</div>


<div class="deliveryBox">

📋 <strong>
حالة الطلب:
</strong>

${escapeHtml(status)}

</div>


${whatsappButton}


${statusButton}


<button
class="delete"
onclick="deleteOrder('${item.id}')"
>

🗑️ حذف الطلب

</button>


</div>

`;

});

}catch(error){

console.error(error);

ordersBox.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل الطلبات.

<br><br>

${escapeHtml(
error.message
)}

</div>

`;

}

}


/* =====================================
   تحديد رسوم التوصيل
===================================== */

window.setDelivery =
async function(
id,
fee,
distanceType
){

try{

const orderRef =
doc(
db,
"orders",
id
);


const orderSnap =
await getDoc(
orderRef
);


if(!orderSnap.exists()){

alert(
"لم يتم العثور على الطلب"
);

return;

}


const orderData =
orderSnap.data();


const products =
Array.isArray(
orderData.products
)
? orderData.products
: [];


let productsTotal = 0;


products.forEach(product=>{

const price =
Number(product.price) || 0;


const quantity =
Number(product.quantity) > 0
? Number(product.quantity)
: 1;


productsTotal +=
price * quantity;

});


const newTotal =
productsTotal +
Number(fee);


await updateDoc(

orderRef,

{

deliveryFee:
Number(fee),

deliveryType:
distanceType,

productsTotal:
Number(productsTotal),

total:
Number(newTotal)

}

);


alert(

"✅ تم تحديد التوصيل\n\n" +

"🚚 النوع: " +
distanceType +

"\n" +

"💰 رسوم التوصيل: " +
fee.toLocaleString() +
" ريال\n\n" +

"🛍️ المنتجات: " +
productsTotal.toLocaleString() +
" ريال\n\n" +

"💵 الإجمالي النهائي: " +
newTotal.toLocaleString() +
" ريال"

);


loadOrders();


}catch(error){

console.error(
"خطأ تحديد التوصيل:",
error
);

alert(

"❌ حدث خطأ أثناء تحديد التوصيل:\n\n" +

(error.message ||
"خطأ غير معروف")

);

}

};


/* =====================================
   إرسال الإجمالي عبر واتساب
===================================== */

window.sendFinalWhatsApp =
async function(
id,
encodedPhone
){

try{

const orderRef =
doc(
db,
"orders",
id
);


const orderSnap =
await getDoc(
orderRef
);


if(!orderSnap.exists()){

alert(
"لم يتم العثور على الطلب"
);

return;

}


const data =
orderSnap.data();


let phone =
decodeURIComponent(encodedPhone)
.replace(/[^0-9]/g, "");

/* تحويل الرقم اليمني إلى الصيغة الدولية */

if(phone.startsWith("0")){

phone =
"967" +
phone.substring(1);

}
else if(phone.startsWith("7")){

phone =
"967" +
phone;

}
else if(phone.startsWith("967")){

phone =
phone;

}


const products =
Array.isArray(data.products)
? data.products
: [];


let productsTotal = 0;

let productsMessage = "";


products.forEach(
(item,index)=>{

const price =
Number(item.price) || 0;

const quantity =
Number(item.quantity) > 0
? Number(item.quantity)
: 1;

const itemTotal =
price * quantity;

productsTotal +=
itemTotal;


productsMessage +=
`${index + 1}. ${item.name} × ${quantity} = ${itemTotal.toLocaleString()} ريال\n`;

});


const deliveryFee =
Number(data.deliveryFee) || 0;


const total =
productsTotal +
deliveryFee;


if(
deliveryFee !== 300 &&
deliveryFee !== 500 &&
deliveryFee !== 700
){

alert(
"⚠️ حدد رسوم التوصيل أولًا."
);

return;

}


const message =

`🛒 تحديث طلبك من سوق مباشر

مرحبًا ${data.customerName || "عميلنا الكريم"} 🌷

🏪 التاجر:
${data.shopName || "سوق مباشر"}

📦 المنتجات:
${productsMessage}

🛍️ قيمة المنتجات:
${productsTotal.toLocaleString()} ريال

🚚 رسوم التوصيل:
${deliveryFee.toLocaleString()} ريال

💰 الإجمالي النهائي:
${total.toLocaleString()} ريال

📍 الحي:
${data.customerAddress || "-"}

🆔 رقم الطلب:
${id}

شكراً لطلبك من سوق مباشر ❤️`;


if(!phone){

alert(
"⚠️ رقم جوال الزبون غير موجود."
);

return;

}


window.open(

`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,

"_blank"

);


/* =====================================
   حفظ حالة الإرسال
===================================== */

await updateDoc(

orderRef,

{

finalMessageSent:
true,

finalMessageSentAt:
serverTimestamp()

}

);


}catch(error){

console.error(error);

alert(

"❌ حدث خطأ أثناء إرسال رسالة واتساب:\n\n" +

error.message

);

}

};


/* =====================================
   تغيير الحالة
===================================== */

window.changeStatus =
async function(id){

try{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"تم التوصيل"
}

);


alert(
"تم تغيير حالة الطلب إلى تم التوصيل ✅"
);


loadOrders();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء تغيير حالة الطلب:\n" +

error.message

);

}

};


/* =====================================
   نقل إلى الأرشيف
===================================== */

window.archiveOrder =
async function(id){

if(!confirm(
"هل تريد نقل هذا الطلب إلى الأرشيف؟"
)){

return;

}


try{

const orderRef =
doc(
db,
"orders",
id
);


const orderSnap =
await getDoc(
orderRef
);


if(!orderSnap.exists()){

alert(
"لم يتم العثور على الطلب"
);

return;

}


const orderData =
orderSnap.data();


await setDoc(

doc(
db,
"archivedOrders",
id
),

{

...orderData,

archivedAt:
serverTimestamp()

}

);


await deleteDoc(
orderRef
);


alert(
"تم نقل الطلب إلى الأرشيف بنجاح 📚✅"
);


loadOrders();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء نقل الطلب إلى الأرشيف:\n" +

error.message

);

}

};


/* =====================================
   حذف الطلب
===================================== */

window.deleteOrder =
async function(id){

if(!confirm(
"هل تريد حذف هذا الطلب؟"
)){

return;

}


try{

await deleteDoc(

doc(
db,
"orders",
id
)

);


alert(
"تم حذف الطلب ✅"
);


loadOrders();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء حذف الطلب:\n" +

error.message

);

}

};


/* =====================================
   حماية HTML
===================================== */

function escapeHtml(text){

return String(
text ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================
   التحقق من المدير
===================================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

alert(
"يجب تسجيل دخول المدير أولاً"
);

return;

}


if(

user.email !==
"waleedahmad@gmail.com"

&&

user.email !==
"waleedahmadahmad@gmail.com"

&&

user.email !==
"waleedahmad2031@gmail.com"

){

alert(
"ليس لديك صلاحية دخول طلبات الزبائن"
);

return;

}


loadOrders();

}

);

</script>

</body>

   </html>
