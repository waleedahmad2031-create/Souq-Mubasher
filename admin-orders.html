<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>طلبات الزبائن | سوق مباشر</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#f5f5f5;
overflow-x:hidden;
}

header{
background:#009688;
color:#fff;
padding:18px;
text-align:center;
font-size:25px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:18px;
border-radius:12px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
color:#fff;
}

button:disabled{
background:#999 !important;
cursor:not-allowed;
}

.back{
background:#757575;
}

.reload{
background:#009688;
}

.orderBox{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
border-right:5px solid #009688;
}

.orderHeader{
line-height:1.9;
margin-bottom:10px;
}

.orderInfo{
font-size:15px;
line-height:2;
}

.sellerBox{
background:#e0f2f1;
color:#00695c;
padding:12px;
margin:10px 0;
border-radius:8px;
font-size:17px;
font-weight:bold;
}

.productsList{
background:#f5f5f5;
padding:10px;
margin-top:10px;
border-radius:8px;
}

.productOrder{
padding:8px 5px;
border-bottom:1px solid #ddd;
line-height:1.8;
}

.productOrder:last-child{
border-bottom:none;
}

.totalBox{
background:#e8f5e9;
padding:12px;
margin-top:10px;
border-radius:8px;
line-height:2;
}

.finalTotal{
font-size:20px;
font-weight:bold;
color:#00897b;
}

.deliveryCalculation{
background:#e3f2fd;
padding:12px;
margin-top:10px;
border-radius:8px;
line-height:2;
}

.status{
background:#ff9800;
}

.archive{
background:#5e35b1;
}

.delete{
background:#e53935;
}

.empty{
text-align:center;
padding:30px;
color:#777;
line-height:2;
}

.errorBox{
background:#ffebee;
color:#c62828;
padding:18px;
border-radius:10px;
line-height:2;
margin-top:15px;
word-break:break-word;
}

.successBox{
background:#e8f5e9;
color:#2e7d32;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.loading{
text-align:center;
padding:30px;
color:#555;
font-size:18px;
}

hr{
border:none;
border-top:1px solid #ddd;
margin:10px 0;
}

</style>

</head>

<body>

<header>
📦 طلبات الزبائن
</header>

<div class="container">

<div class="card">

<button
class="back"
onclick="location.href='admin.html'"
>
⬅️ العودة إلى لوحة الإدارة
</button>

<button
class="reload"
id="reloadButton"
>
🔄 تحديث الطلبات
</button>

<div id="orders">

<div class="loading">
⏳ جاري تحميل الطلبات...
</div>

</div>

</div>

</div>


<script type="module">

import { db, auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
collection,
getDocs,
getDoc,
deleteDoc,
updateDoc,
setDoc,
doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   العناصر
===================================== */

const ordersBox =
document.getElementById("orders");

const reloadButton =
document.getElementById("reloadButton");


/* =====================================
   حساب توصيل الكرتون
===================================== */

function getDeliveryPerCarton(price){

price = Number(price) || 0;

if(price < 1500){

return 50;

}

if(price < 2000){

return 70;

}

return 100;

}


/* =====================================
   حساب التوصيل
===================================== */

function calculateDelivery(products){

let deliveryTotal = 0;

let details = [];

products.forEach(product => {

const price =
Number(product.price) || 0;

const quantity =
Number(product.quantity) > 0
? Number(product.quantity)
: 1;

const deliveryPerCarton =
getDeliveryPerCarton(price);

const productDelivery =
deliveryPerCarton * quantity;

deliveryTotal +=
productDelivery;

details.push({

name:
product.name || "منتج",

price:
price,

quantity:
quantity,

deliveryPerCarton:
deliveryPerCarton,

productDelivery:
productDelivery

});

});

return {

deliveryTotal:
deliveryTotal,

details:
details

};

}


/* =====================================
   تحميل الطلبات
===================================== */

async function loadOrders(){

ordersBox.innerHTML = `

<div class="loading">

⏳ جاري تحميل الطلبات...

<br>

<small>
يرجى الانتظار...
</small>

</div>

`;

reloadButton.disabled = true;

try{

/* =====================================
   جلب الطلبات
===================================== */

const snap =
await getDocs(
collection(db,"orders")
);


/* =====================================
   لا توجد طلبات
===================================== */

if(snap.empty){

ordersBox.innerHTML = `

<div class="empty">

📦 لا توجد طلبات حاليًا.

<br>

عندما يرسل أحد الزبائن طلبًا سيظهر هنا.

</div>

`;

reloadButton.disabled = false;

return;

}


/* =====================================
   ترتيب الطلبات
===================================== */

const orders =
snap.docs.sort((a,b)=>{

const dateA =
a.data().createdAt?.toDate
? a.data().createdAt.toDate().getTime()
: 0;

const dateB =
b.data().createdAt?.toDate
? b.data().createdAt.toDate().getTime()
: 0;

return dateB - dateA;

});


ordersBox.innerHTML = "";


/* =====================================
   عرض كل طلب
===================================== */

orders.forEach(item => {

const data =
item.data();


/* =====================================
   بيانات العميل
===================================== */

const customerName =
data.customerName ||
data.name ||
"بدون اسم";

const customerPhone =
data.customerPhone ||
data.phone ||
"-";

const customerAddress =
data.customerAddress ||
data.address ||
"-";

const city =
data.customerCity ||
"إب";

const deliveryArea =
data.deliveryArea ||
"-";

const orderType =
data.orderType ||
"جملة";

const deliveryTime =
data.deliveryTime ||
"بعد تسجيل الطلب";


/* =====================================
   بيانات التاجر
===================================== */

const shopName =
data.shopName ||
(
Array.isArray(data.products) &&
data.products.length > 0
? data.products[0].shopName
: ""
) ||
"سوق مباشر";


/* =====================================
   المنتجات
===================================== */

const products =
Array.isArray(data.products)
? data.products
: [];


let productsHTML = "";

let calculatedCartons = 0;

let calculatedProductsTotal = 0;


products.forEach(product => {

const name =
product.name ||
"منتج";

const price =
Number(product.price) || 0;

const quantity =
Number(product.quantity) > 0
? Number(product.quantity)
: 1;

const productTotal =
price * quantity;

calculatedCartons +=
quantity;

calculatedProductsTotal +=
productTotal;


productsHTML += `

<div class="productOrder">

🛍️ <strong>
${escapeHtml(name)}
</strong>

<br>

📦 الكمية:
<strong>
${quantity} كرتون
</strong>

<br>

💰 سعر الكرتون:
<strong>
${price.toLocaleString()} ريال
</strong>

<br>

💵 إجمالي المنتج:
<strong>
${productTotal.toLocaleString()} ريال
</strong>

</div>

`;

});


/* =====================================
   مجموع المنتجات
===================================== */

const productsTotal =
calculatedProductsTotal;


/* =====================================
   التوصيل
===================================== */

const deliveryCalculation =
calculateDelivery(products);

const deliveryFee =
deliveryCalculation.deliveryTotal;


/* =====================================
   الإجمالي النهائي
===================================== */

const total =
productsTotal +
deliveryFee;


/* =====================================
   تفاصيل التوصيل
===================================== */

let deliveryDetailsHTML = "";


deliveryCalculation.details.forEach(detail => {

deliveryDetailsHTML += `

<div>

🛍️ ${escapeHtml(detail.name)}

<br>

📦 ${detail.quantity} كرتون ×
${detail.deliveryPerCarton} ريال

=

<strong>
${detail.productDelivery.toLocaleString()}
ريال
</strong>

</div>

`;

});


/* =====================================
   التاريخ
===================================== */

const createdAt =
data.createdAt?.toDate
? data.createdAt.toDate()
: null;

const createdAtText =
createdAt
? createdAt.toLocaleString(
"ar-SA",
{
year:"numeric",
month:"long",
day:"numeric",
hour:"numeric",
minute:"2-digit"
}
)
: "غير متوفر";


/* =====================================
   الحالة
===================================== */

const status =
data.status ||
"جديد";


let statusButton = "";


if(status === "تم التوصيل"){

statusButton = `

<div
class="successBox"
>
✅ تم التوصيل
</div>

<button
class="archive"
onclick="archiveOrder('${item.id}')"
>
📚 نقل الطلب إلى الأرشيف
</button>

`;

}else{

statusButton = `

<button
class="status"
onclick="changeStatus('${item.id}')"
>
🚚 تغيير الحالة إلى تم التوصيل
</button>

`;

}


/* =====================================
   عرض الطلب
===================================== */

ordersBox.innerHTML += `

<div class="orderBox">

<div class="orderHeader">

<h3>
👤 ${escapeHtml(customerName)}
</h3>

<p>

🕐 <strong>
وقت إنشاء الطلب:
</strong>

${createdAtText}

</p>

</div>


<div class="sellerBox">

🏪 التاجر:

<strong>
${escapeHtml(shopName)}
</strong>

</div>


<div class="orderInfo">

📱 الجوال:

<strong>
${escapeHtml(customerPhone)}
</strong>

<br>

📍 المدينة:

${escapeHtml(city)}

<br>

🏘️ الحي:

${escapeHtml(deliveryArea)}

<br>

🏠 العنوان:

<strong>
${escapeHtml(customerAddress)}
</strong>

<br>

📦 نوع الطلب:

${escapeHtml(orderType)}

<br>

🕐 وقت التوصيل:

${escapeHtml(deliveryTime)}

</div>


<hr>


<strong>
🛒 المنتجات:
</strong>


<div class="productsList">

${
productsHTML ||
"<p>❌ لا توجد منتجات داخل الطلب</p>"
}

</div>


<div class="deliveryCalculation">

🚚 <strong>
حساب التوصيل
</strong>

<br><br>

${deliveryDetailsHTML}

<hr>

💰 <strong>
إجمالي التوصيل:
${deliveryFee.toLocaleString()}
ريال
</strong>

</div>


<div class="totalBox">

📦 <strong>
إجمالي الكراتين:
</strong>

${calculatedCartons}

<br>

🛍️ <strong>
مجموع المنتجات:
</strong>

${productsTotal.toLocaleString()}
ريال

<br>

🚚 <strong>
رسوم التوصيل:
</strong>

${deliveryFee.toLocaleString()}
ريال

<hr>

<span class="finalTotal">

💰 الإجمالي النهائي:

${total.toLocaleString()}
ريال

</span>

</div>


<div
class="deliveryCalculation"
>

📋 <strong>
حالة الطلب:
</strong>

${escapeHtml(status)}

</div>


${statusButton}


<button
class="delete"
onclick="deleteOrder('${item.id}')"
>

🗑️ حذف الطلب

</button>


</div>

`;

});


reloadButton.disabled = false;


}catch(error){

console.error(
"خطأ تحميل الطلبات:",
error
);


ordersBox.innerHTML = `

<div class="errorBox">

❌ <strong>
تعذر تحميل الطلبات
</strong>

<br><br>

<strong>
سبب الخطأ:
</strong>

<br>

${escapeHtml(error.message)}

<br><br>

إذا ظهر لك:

<strong>
Missing or insufficient permissions
</strong>

فالمشكلة من صلاحيات Firestore.

</div>

`;

reloadButton.disabled = false;

}

}


/* =====================================
   تغيير حالة الطلب
===================================== */

window.changeStatus =
async function(id){

try{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"تم التوصيل"
}

);

alert(
"تم تغيير حالة الطلب إلى تم التوصيل ✅"
);

loadOrders();


}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تغيير الحالة:\n" +
error.message
);

}

};


/* =====================================
   نقل الطلب إلى الأرشيف
===================================== */

window.archiveOrder =
async function(id){

if(!confirm(
"هل تريد نقل هذا الطلب إلى الأرشيف؟"
)){

return;

}


try{

const orderRef =
doc(
db,
"orders",
id
);


/* قراءة الطلب */

const snap =
await getDoc(orderRef);


if(!snap.exists()){

alert(
"❌ لم يتم العثور على الطلب"
);

return;

}


const orderData =
snap.data();


/* حفظ في الأرشيف */

await setDoc(

doc(
db,
"archivedOrders",
id
),

{

...orderData,

archivedAt:
serverTimestamp()

}

);


/* حذف من الطلبات الحالية */

await deleteDoc(orderRef);


alert(
"تم نقل الطلب إلى الأرشيف بنجاح 📚✅"
);


loadOrders();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء نقل الطلب إلى الأرشيف:\n" +

error.message

);

}

};


/* =====================================
   حذف الطلب
===================================== */

window.deleteOrder =
async function(id){

if(!confirm(
"هل تريد حذف هذا الطلب نهائيًا؟"
)){

return;

}


try{

await deleteDoc(

doc(
db,
"orders",
id
)

);

alert(
"تم حذف الطلب ✅"
);

loadOrders();


}catch(error){

console.error(error);

alert(

"حدث خطأ أثناء حذف الطلب:\n" +

error.message

);

}

};


/* =====================================
   حماية HTML
===================================== */

function escapeHtml(text){

return String(
text ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =====================================
   تحديث يدوي
===================================== */

reloadButton.onclick =
function(){

loadOrders();

};


/* =====================================
   التحقق من المدير
===================================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

ordersBox.innerHTML = `

<div class="errorBox">

❌ يجب تسجيل دخول المدير أولًا.

<br><br>

<a href="login.html">

الانتقال إلى تسجيل الدخول

</a>

</div>

`;

return;

}


/* =====================================
   البريد المسموح
===================================== */

const email =
(user.email || "").toLowerCase();


const allowedEmail =
"waleedahmad2031@gmail.com";


if(email !== allowedEmail){

ordersBox.innerHTML = `

<div class="errorBox">

❌ ليس لديك صلاحية دخول طلبات الزبائن.

<br><br>

الحساب الحالي:

${escapeHtml(user.email || "غير معروف")}

</div>

`;

return;

}


/* =====================================
   تحميل الطلبات
===================================== */

loadOrders();

});

</script>

</body>

   </html>
