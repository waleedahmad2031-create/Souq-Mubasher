<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة منتج | سوق مباشر</title>

<style>
body{
font-family:Tahoma,Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.box{
max-width:500px;
margin:30px auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0b7a75;
margin-bottom:20px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

textarea{
height:100px;
resize:vertical;
}

button{
width:100%;
padding:12px;
background:#0b7a75;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#msg{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h2>إضافة منتج</h2>

<input
type="text"
id="name"
placeholder="اسم المنتج"
>

<input
type="number"
id="price"
placeholder="السعر"
>

<select id="category">

<option value="">اختر القسم</option>

<option value="عطور">عطور</option>
<option value="زيوت">زيوت</option>
<option value="خضروات وفواكه">خضروات وفواكه</option>
<option value="مواد غذائية">مواد غذائية</option>
<option value="أدوات منزلية">أدوات منزلية</option>
<option value="خدمات">خدمات</option>

</select>

<input
type="text"
id="image"
placeholder="رابط صورة المنتج"
>

<textarea
id="description"
placeholder="وصف المنتج"
></textarea>

<button id="saveBtn">
حفظ المنتج
</button>

<div id="msg"></div>

</div>

<script type="module" src="add-product.js"></script>

</body>
</html>
